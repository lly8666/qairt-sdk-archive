plugins { id 'com.android.application' }
android {
    namespace 'io.github.tasaudit.runtimeinventory'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.tasaudit.runtimeinventory.v11'
        minSdk 29
        targetSdk 27
        versionCode 2
        versionName '1.1.0-tas-mali-full-batch'
    }
    buildTypes { debug { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
