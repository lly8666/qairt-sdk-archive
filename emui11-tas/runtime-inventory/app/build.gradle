plugins { id 'com.android.application' }
android {
    namespace 'io.github.tasaudit.runtimeinventory'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.tasaudit.runtimeinventory.v12'
        minSdk 29
        targetSdk 27
        versionCode 3
        versionName '1.2.0-tas-service-survey'
    }
    buildTypes { debug { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
