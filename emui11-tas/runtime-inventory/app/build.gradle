plugins { id 'com.android.application' }
android {
    namespace 'io.github.tasaudit.runtimeinventory'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.tasaudit.runtimeinventory.v13'
        minSdk 29
        targetSdk 27
        versionCode 4
        versionName '1.3.0-tas-dumpstate-config'
    }
    buildTypes { debug { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
