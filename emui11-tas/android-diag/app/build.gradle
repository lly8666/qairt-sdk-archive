plugins { id 'com.android.application' }
android {
    namespace 'io.github.tasaudit.diag'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.tasaudit.diag'
        minSdk 29
        targetSdk 29
        versionCode 2
        versionName '1.1.0-tas185'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
