plugins { id 'com.android.application' }

android {
    namespace 'io.github.lly8666.meanvc2.rev46focused'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.lly8666.meanvc2.rev46focused'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2-rev46-block4-focused-htp-batch'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    androidResources { noCompress += ['onnx', 'f32', 'json', 'txt'] }
}

dependencies {
    implementation('com.microsoft.onnxruntime:onnxruntime-android-qnn:1.27.0') {
        exclude group: 'com.qualcomm.qti', module: 'qnn-runtime'
    }
    implementation 'com.qualcomm.qti:qnn-runtime:2.44.0'
}
