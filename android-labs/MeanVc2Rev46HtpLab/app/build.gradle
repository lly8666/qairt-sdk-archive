plugins { id 'com.android.application' }

def ks = rootProject.file('ci/rev46-public-lab.p12')
android {
    namespace 'com.simadmin.meanvc2rev46lab'
    compileSdk 35
    defaultConfig {
        applicationId 'com.simadmin.meanvc2rev46lab'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1-rev46-htp-lowering-batch'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        publicLab {
            storeFile ks
            storePassword 'meanvc2lab'
            keyAlias 'meanvc2lab'
            keyPassword 'meanvc2lab'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.publicLab } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
    androidResources { noCompress += ['onnx', 'bin', 'f32'] }
}
configurations.configureEach { resolutionStrategy.force 'com.qualcomm.qti:qnn-runtime:2.44.0' }
dependencies {
    implementation('com.microsoft.onnxruntime:onnxruntime-android-qnn:1.27.0') {
        exclude group: 'com.qualcomm.qti', module: 'qnn-runtime'
    }
    implementation 'com.qualcomm.qti:qnn-runtime:2.44.0'
}
