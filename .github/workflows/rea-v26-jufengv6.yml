name: REA V33 readiness: auth inbox call parallel
on:
  push:
    branches:
      - sandbox/rea-jufeng-v6-20261103
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rea-v31-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: REA native ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - lane: login-auth-provision
            addresses: '0x7b8268,0x7b77fc,0x7b6f28,0x7a7f7c,0x6866a8,0x6866f0,0x7a1740'
          - lane: inbox-delivery
            addresses: '0x6b42e4,0x6b6280,0x65bbc0,0x61fc3c,0x6acb94,0x6acc54'
          - lane: call-session-media
            addresses: '0x70e420,0x70caac,0x70b96c,0x6fbbd4,0x6f9170,0x72fc48'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch verified jufengv6 Release ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inputs" results
          gh release download jufengv6 --repo "$GITHUB_REPOSITORY" --pattern v6.zip --dir "$RUNNER_TEMP/inputs" --clobber
          test "$(stat -c %s "$RUNNER_TEMP/inputs/v6.zip")" -eq 59488232
          echo "1ba353c5dc71cdc92e6852b9efc853dfbeb63bda2d3d74636af4a52b73457627  $RUNNER_TEMP/inputs/v6.zip" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/inputs/v6.zip"
      - name: Extract libmtc ARM64 and record immutable identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,struct,zipfile
          zip_path=pathlib.Path(os.environ['RUNNER_TEMP'])/'inputs/v6.zip'
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'inputs/libmtc.so'
          want='57086cd624d8227dc1b1b64a63d7c8b2258f87b261779b681a9bfd306ad9d2e8'
          found=[]
          report={'release':'jufengv6','asset':'v6.zip','candidates':[],'selected':None}
          with zipfile.ZipFile(zip_path) as z:
            for f in z.infolist():
              if pathlib.PurePosixPath(f.filename).name.lower()!='libmtc.so' or f.is_dir() or f.file_size>150000000: continue
              data=z.read(f)
              sha=hashlib.sha256(data).hexdigest()
              arm64=len(data)>=64 and data[:4]==bytes.fromhex('7f454c46') and data[4:7]==bytes([2,1,1]) and struct.unpack_from('<H',data,18)[0]==183
              report['candidates'].append({'entry':f.filename,'size':len(data),'sha256':sha,'arm64':arm64,'matches_v25':sha==want})
              if arm64: found.append((sha,f.filename,data))
          chosen=[x for x in found if x[0]==want]
          if not chosen and len(found)==1: chosen=found
          if len(chosen)==1:
            sha,name,data=chosen[0]
            output.write_bytes(data)
            report['selected']={'entry':name,'size':len(data),'sha256':sha,'matches_v25':sha==want}
          pathlib.Path('results/input-identity.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if report['selected'] is None: raise SystemExit('No unambiguous arm64 libmtc.so in v6.zip')
          PY
          readelf -W -h -l -S -d "$RUNNER_TEMP/inputs/libmtc.so" > results/libmtc-elf-layout.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned REA CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rea" --ignore-scripts --omit=dev --no-audit --no-fund --no-save --no-package-lock rea-agents@6.8.0
          "$RUNNER_TEMP/rea/node_modules/.bin/rea" --version
      - name: Install verified Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ghidra"
          cd "$RUNNER_TEMP/ghidra"
          curl -fL --retry 3 --retry-all-errors -o ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          echo 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  ghidra.zip' | sha256sum -c -
          unzip -q ghidra.zip
          test -x ghidra_12.1.4_PUBLIC/support/analyzeHeadless
      - name: Batch decompile Router connection chain in one REA MCP session
        shell: bash
        env:
          GHIDRA_INSTALL_DIR: ${{ runner.temp }}/ghidra/ghidra_12.1.4_PUBLIC
          GHIDRA_HEADLESS_MAXMEM: 6G
          REA_GHIDRA_STARTUP_TIMEOUT_MS: '4200000'
          REA_GHIDRA_DECOMPILE_TIMEOUT_SECONDS: '180'
          V31_ADDRESSES: ${{ matrix.addresses }}
          V31_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rea/batch.mjs" <<'JS'
          import fs from 'node:fs';
          import { Client } from '@modelcontextprotocol/client';
          import { StdioClientTransport } from '@modelcontextprotocol/client/stdio';
          const out = process.env.GITHUB_WORKSPACE + '/results';
          const sdkPath = process.env.RUNNER_TEMP + '/rea/node_modules/rea-agents/scripts/rea.mjs';
          const target = process.env.RUNNER_TEMP + '/inputs/libmtc.so';
          const addresses = (process.env.V31_ADDRESSES||'').split(',').map(s=>s.trim()).filter(Boolean);
          const tr = new StdioClientTransport({command:process.execPath,args:[sdkPath,'mcp'],env:{...process.env,REA_MCP_MAX_RESPONSE_BYTES:'33554432'},stderr:'pipe',maxBufferSize:33554432});
          tr.stderr?.on('data', (c)=>fs.appendFileSync(out+'/rea-mcp.stderr',c));
          const client = new Client({name:'jufeng-v31-${{ matrix.lane }}',version:'1.0.0'});
          function store(name,obj){fs.writeFileSync(out+'/'+name,JSON.stringify(obj,null,2)+'\n');}
          function unwrap(r){if(r.structuredContent!==undefined)return r.structuredContent;const txt=r.content?.find(c=>c.type==='text')?.text;try{return JSON.parse(txt)}catch{return {text:txt}}}
          const state={addresses,steps:[],complete:false};
          try {
            await client.connect(tr); state.steps.push('mcp_connected'); store('batch-progress.json',state);
            const op=await client.callTool({name:'open_binary',arguments:{path:target,provider_id:'ghidra'}},{timeout:120000});
            store('open-binary.json',unwrap(op)); if(op.isError)throw Error('open_binary returned isError');
            state.steps.push('open_binary');store('batch-progress.json',state);
            const batch=await client.callTool({name:'batch_decompile',arguments:{addresses}},{timeout:5100000,resetTimeoutOnProgress:true});
            const evidence=unwrap(batch);store('batch-decompile.json',evidence);
            state.batch_is_error=!!batch.isError;
            state.batch_evidence_id=evidence.evidence_id ?? evidence.result?.evidence_id ?? null;
            if(batch.isError)throw Error('batch_decompile returned isError');
            state.steps.push('batch_decompile');state.complete=true;store('batch-progress.json',state);
          } catch(e) {state.error=String(e?.stack??e);store('batch-progress.json',state); process.exitCode=1;}
          finally {
            try {const result=await client.callTool({name:'close_binary',arguments:{}},{timeout:120000});store('close-binary.json',unwrap(result));}catch(e){store('close-failure.json',{error:String(e)})}
            try {await client.close()}catch(e){store('client-close-failure.json',{error:String(e)})}
          }
          JS
          CPUs="$(python3 -c 'import os; print(",".join(map(str,sorted(os.sched_getaffinity(0))[:2])))')"
          printf '%s\n' "$CPUs" > results/cpu-affinity.txt
          timeout --signal=TERM --kill-after=30s 5600s taskset -c "$CPUs" node "$RUNNER_TEMP/rea/batch.mjs"
      - name: Capture tool and runner environment
        if: always()
        shell: bash
        env:
          GHIDRA_INSTALL_DIR: ${{ runner.temp }}/ghidra/ghidra_12.1.4_PUBLIC
        run: |
          set -uo pipefail
          mkdir -p results
          {
            printf "run_id=%s\ncommit=%s\nrepository=%s\n" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REPOSITORY"
            printf "runner_os=%s\nrunner_arch=%s\n" "$RUNNER_OS" "$RUNNER_ARCH"
            uname -srm
            sed -n 's/^PRETTY_NAME=/ubuntu=/p' /etc/os-release
            printf "node="; node --version
            printf "npm="; npm --version
            printf "java="; java -version 2>&1 | head -1
            printf "python="; python3 --version
            printf "rea="; "$RUNNER_TEMP/rea/node_modules/.bin/rea" --version
            printf "ghidra=12.1.4\n"
            test -x "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" && echo ghidra_headless_exists=true
            printf "sha_libmtc="; sha256sum "$RUNNER_TEMP/inputs/libmtc.so" | cut -d" " -f1
            printf "sha_release="; sha256sum "$RUNNER_TEMP/inputs/v6.zip" | cut -d" " -f1
            printf "cgroup_memory_max="; cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unavailable
            printf "cpu_affinity="; cat results/cpu-affinity.txt 2>/dev/null || echo unavailable
          } > results/runner-environment.txt
      - name: Accept decompile output by item and original sample ID
        if: always()
        shell: bash
        env:
          V31_ADDRESSES: ${{ matrix.addresses }}
          V31_LANE: ${{ matrix.lane }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          root=pathlib.Path('results')
          ids=json.loads((root/'input-identity.json').read_text())
          expected='57086cd624d8227dc1b1b64a63d7c8b2258f87b261779b681a9bfd306ad9d2e8'
          planned=os.environ['V31_ADDRESSES'].split(',')
          try: obj=json.loads((root/'batch-decompile.json').read_text())
          except Exception as e: obj={'normalized_result':{'items':[]},'failure':str(e)}
          items=obj.get('normalized_result',{}).get('items',[])
          report={'lane':os.environ['V31_LANE'],'planned':planned,'returned':len(items),'source_verified':ids.get('selected',{}).get('sha256')==expected,'results':[]}
          for v in items:
            body=v.get('pseudocode')
            report['results'].append({'requested_address':v.get('address'),'canonical_address':(v.get('procedure') or {}).get('address'),'status':v.get('status'),'body_characters':len(body) if isinstance(body,str) else 0,'warnings':body.count('WARNING:') if isinstance(body,str) else 0})
          report['succeeded']=sum(x['status']=='ok' and x['body_characters']>=20 for x in report['results'])
          report['passed']=report['source_verified'] and len(planned)==len(items) and report['succeeded']==len(planned)
          (root/'lane-acceptance.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:report[k] for k in ('lane','returned','succeeded','passed')}))
          sys.exit(0 if report['passed'] else 1)
          PY
      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-v31-${{ matrix.lane }}-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 3

  static-audit:
    name: Symbol and JNI inventory (no Ghidra)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable SO and export business entrypoints
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results "$RUNNER_TEMP/inputs"
          gh release download jufengv6 --repo "$GITHUB_REPOSITORY" --pattern v6.zip --dir "$RUNNER_TEMP/inputs" --clobber
          echo '1ba353c5dc71cdc92e6852b9efc853dfbeb63bda2d3d74636af4a52b73457627  '"$RUNNER_TEMP/inputs/v6.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile,pathlib,os,hashlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'inputs/v6.zip'
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'inputs/libmtc.so'
          wanted='57086cd624d8227dc1b1b64a63d7c8b2258f87b261779b681a9bfd306ad9d2e8'
          with zipfile.ZipFile(p) as z:
            candidates=[(name,z.read(name)) for name in z.namelist() if name.rsplit('/',1)[-1]=='libmtc.so']
          found=[(name,b) for name,b in candidates if hashlib.sha256(b).hexdigest()==wanted]
          assert len(found)==1, 'ambiguous or wrong target'
          dest.write_bytes(found[0][1])
          PY
          readelf -Ws "$RUNNER_TEMP/inputs/libmtc.so" > results/dynsym-full.txt
          python3 - <<'PY'
          import pathlib,re,json
          lines=pathlib.Path('results/dynsym-full.txt').read_text().splitlines()
          rows=[]
          for l in lines:
            m=re.search(r'^\s*\d+:\s+([0-9a-fA-F]+)\s+(\d+)\s+FUNC\s+GLOBAL\s+DEFAULT\s+\S+\s+(\S+)',l)
            if m and m.group(3).startswith(('Mtc_Cli','Mtc_Im','Mtc_Call','Java_com_justalk_cloud_lemon')):
              rows.append((m.group(3),int(m.group(1),16),int(m.group(2))))
          rows=sorted(set(rows))
          with open('results/business-export-map.tsv','w') as f:
            f.write('symbol\telf_vma\tghidra_vma\tsize\n')
            for n,a,s in rows:f.write(f'{n}\t0x{a:x}\t0x{a+0x100000:x}\t{s}\n')
          must={'Mtc_CliLogin','Mtc_CliGetRouterInfo','Mtc_ImSendText','Mtc_ImRecv','Mtc_CallOut','Mtc_CallTerm'}
          present={n for n,_,_ in rows}
          report={'exports':len(rows),'jni_exports':sum(n.startswith('Java_com_justalk_cloud_lemon') for n,_,_ in rows),'key_symbols_verified':sorted(must & present),'missing':sorted(must-present)}
          pathlib.Path('results/static-acceptance.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          assert not report['missing']
          PY
          uname -srm > results/runner-environment.txt
          python3 --version >> results/runner-environment.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-v31-static-${{ github.run_id }}
          path: results/
          retention-days: 3

  i386-abi:
    name: i386 freestanding ABI smoke under QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Compile test and run positive and mutation-negative variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          if ! command -v qemu-i386 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-user >/dev/null
          fi
          cat > results/abi-smoke.c <<'C'
          typedef unsigned int u32;
          static u32 rol(u32 x, int n) {return (x<<n)|(x>>(32-n));}
          static int check(void) {
            unsigned char b[4]={0x12,0x34,0x56,0x78};
            u32 be=((u32)b[0]<<24)|((u32)b[1]<<16)|((u32)b[2]<<8)|b[3];
            u32 le=(u32)b[0]|((u32)b[1]<<8)|((u32)b[2]<<16)|((u32)b[3]<<24);
            int ok=(sizeof(void*)==4 && be==0x12345678u && le==0x78563412u && rol(0x10203040u,8)==0x20304010u);
          #ifdef MUTATE_EXPECTED
            ok= !ok;
          #endif
            return ok?0:1;
          }
          __attribute__((noreturn)) void _start(void) {
            int code=check();
            __asm__ volatile("int $0x80"::"a"(1),"b"(code):"memory");
            __builtin_unreachable();
          }
          C
          clang --target=i386-linux-gnu -O2 -fuse-ld=lld -nostdlib -static -ffreestanding -Wl,-e,_start -o results/abi-positive results/abi-smoke.c
          clang --target=i386-linux-gnu -O2 -fuse-ld=lld -nostdlib -static -ffreestanding -DMUTATE_EXPECTED -Wl,-e,_start -o results/abi-negative results/abi-smoke.c
          readelf -h results/abi-positive > results/elf32-header.txt
          python3 - <<'PY'
          import subprocess,os,json,pathlib,platform
          cases=[]
          for fn,expect in [('abi-positive',0),('abi-negative',1)]:
            p=subprocess.run(['qemu-i386',f'results/{fn}'],capture_output=True,text=True,timeout=20)
            cases.append({'program':fn,'expected_exit':expect,'actual_exit':p.returncode,'passed':p.returncode==expect,'stderr':p.stderr[:400]})
          report={'arch':platform.machine(),'cases':cases,'pass':all(c['passed'] for c in cases)}
          pathlib.Path('results/i386-acceptance.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          assert report['pass']
          PY
          { uname -srm; clang --version | head -1; qemu-i386 --version | head -1; } > results/runner-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-v31-i386-${{ github.run_id }}
          path: results/
          retention-days: 3
