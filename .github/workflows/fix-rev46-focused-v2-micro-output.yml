name: Fix rev46 focused-v2 micro output qualification

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[fix-rev46-focused-v2-micro-output]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact reusable runner fix
        shell: bash
        run: |
          set -euo pipefail
          main=android-labs/rev46-block4-focused-htp-batch/app/src/main/java/io/github/lly8666/meanvc2/rev46focused/MainActivity.java
          python - "$main" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old1='if(c==null||q==null||r==null||!c.ok()||!q.ok()||!r.ok()){failures++;kv(b,p+"_complete",false);continue;}'
          new1='if(!microOk(c)||!microOk(q)||!microOk(r)){failures++;kv(b,p+"_complete",false);continue;}'
          old2='private void microPair(StringBuilder b,String shape,String in,String backend,Map<String,Map<String,OutputSet>> m,String a,String c){OutputSet x=m.get(a).get(in),y=m.get(c).get(in);String p="micro_"+shape+"_"+in+"_"+backend+"_"+a+"_vs_"+c;if(x!=null&&y!=null&&x.ok()&&y.ok())metricKv(b,p,metric(x.v.get("y"),y.v.get("y")));else kv(b,p+"_unavailable",true);}'
          new2='private static boolean microOk(OutputSet r){return r!=null&&r.error.isEmpty()&&r.v.containsKey("y");}\n    private void microPair(StringBuilder b,String shape,String in,String backend,Map<String,Map<String,OutputSet>> m,String a,String c){OutputSet x=m.get(a).get(in),y=m.get(c).get(in);String p="micro_"+shape+"_"+in+"_"+backend+"_"+a+"_vs_"+c;if(microOk(x)&&microOk(y))metricKv(b,p,metric(x.v.get("y"),y.v.get("y")));else kv(b,p+"_unavailable",true);}'
          for old in (old1,old2):
              if s.count(old)!=1: raise SystemExit(f'exact assertion failed count={s.count(old)}')
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
          test "$(sha256sum "$main" | awk '{print $1}')" = '258be195de6e6e703500bb3b91c761a1fd62bb0002b4aa7a56954a78408a4a98'
      - name: Commit reusable source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-labs/rev46-block4-focused-htp-batch/app/src/main/java/io/github/lly8666/meanvc2/rev46focused/MainActivity.java
          git commit -m 'rev46 focused: fix micro single-output qualification'
          git push origin HEAD:main
      - name: Report result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "REV46_FOCUSED_V2_MICRO_OUTPUT_FIX_${{ job.status }}\n\nRun: **${GITHUB_RUN_ID}**"
