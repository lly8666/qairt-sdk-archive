name: Cleanup QAIRT transport artifact

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  cleanup:
    if: startsWith(github.event.issue.title, '[sdk-artifact-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate and delete exact host-tools artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ ! "$ISSUE_TITLE" =~ \[sdk-artifact-cleanup\][[:space:]]+([0-9]+) ]]; then
            echo 'title must be: [sdk-artifact-cleanup] <artifact-id>' >&2
            exit 2
          fi
          artifact_id="${BASH_REMATCH[1]}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"
          name="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])' <<<"$json")"
          case "$name" in
            qairt-2.42.0.251225-host-tools*) ;;
            *) echo "refusing unrelated artifact: $name" >&2; exit 3 ;;
          esac
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -d "$(python3 - <<PY
import json
print(json.dumps({'body': 'Deleted verified QAIRT transport artifact `${artifact_id}` named `${name}`.'}))
PY
)" >/dev/null
          echo "DELETED_ARTIFACT_ID=$artifact_id"
          echo "DELETED_ARTIFACT_NAME=$name"
