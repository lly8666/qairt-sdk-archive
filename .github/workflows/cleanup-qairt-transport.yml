name: Cleanup QAIRT transport artifact

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: startsWith(github.event.issue.title, '[sdk-artifact-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate and delete exact host-tools artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [[ ! "$ISSUE_TITLE" =~ \[sdk-artifact-cleanup\][[:space:]]+([0-9]+) ]]; then
            echo 'title must be: [sdk-artifact-cleanup] <artifact-id>' >&2
            exit 2
          fi
          artifact_id="${BASH_REMATCH[1]}"
          api="repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          json="$(gh api "$api")"
          name="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])' <<<"$json")"
          case "$name" in
            qairt-2.42.0.251225-host-tools*) ;;
            *) echo "refusing unrelated artifact: $name" >&2; exit 3 ;;
          esac
          gh api --method DELETE "$api"
          echo "DELETED_ARTIFACT_ID=$artifact_id"
          echo "DELETED_ARTIFACT_NAME=$name"
