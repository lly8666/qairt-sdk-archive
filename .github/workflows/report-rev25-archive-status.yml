name: Report rev25 archive status
on:
  issues:
    types: [opened]
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  report:
    if: github.event.issue.title == '[status-rev25-frozen-host-inputs]'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          data="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow archive-rev25-frozen-host-inputs.yml --limit 5 --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url)"
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Latest rev25 archive workflow runs:\n\n\`\`\`json\n${data}\n\`\`\`"
