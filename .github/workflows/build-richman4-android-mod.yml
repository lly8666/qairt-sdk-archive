name: Build Richman 4 MOD Android ARM64 (personal sideload)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-richman4-android-mod.yml

permissions:
  contents: read

concurrency:
  group: richman4-android-mod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RICH4_UPSTREAM_SHA: 6c0dc09a559d829ffbe65b224229569f850568e9

    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build pinned libarchive 3.7.4 (RAR4 CRC bug fix)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libarchive-dev
          url="https://github.com/libarchive/libarchive/releases/download/v3.7.4/libarchive-3.7.4.tar.gz"
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/libarchive-3.7.4.tar.gz" "$url"
          printf '%s  %s\n' \
            '7875d49596286055b52439ed42f044bd8ad426aa4cc5aabd96bfe7abb971d5e8' \
            "$RUNNER_TEMP/libarchive-3.7.4.tar.gz" | sha256sum -c -
          tar xf "$RUNNER_TEMP/libarchive-3.7.4.tar.gz" -C "$RUNNER_TEMP"
          prefix="$RUNNER_TEMP/libarchive-3.7.4-install"
          cmake -S "$RUNNER_TEMP/libarchive-3.7.4" -B "$RUNNER_TEMP/libarchive-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DENABLE_TEST=OFF -DENABLE_TAR=OFF -DENABLE_CPIO=OFF -DENABLE_CAT=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/libarchive-build" --parallel 4
          cmake --install "$RUNNER_TEMP/libarchive-build"
          echo "LIBARCHIVE_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Fetch fixed upstream Richman 4 native Android source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/richman4-src"
          git -C "$RUNNER_TEMP/richman4-src" remote add origin https://github.com/lly8666/richman4-remastered.git
          git -C "$RUNNER_TEMP/richman4-src" fetch --depth 1 origin "$RICH4_UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/richman4-src" checkout --detach FETCH_HEAD
          echo "RICH4_SOURCE=$RUNNER_TEMP/richman4-src" >> "$GITHUB_ENV"
          git -C "$RUNNER_TEMP/richman4-src" rev-parse HEAD

      - name: Fetch three original game RAR volumes from testrich4 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          parts="$RUNNER_TEMP/richman4-parts"
          mkdir -p "$parts"
          gh release download testrich4 --repo "$GITHUB_REPOSITORY" \
            --dir "$parts" --pattern '4.rar.*'
          printf '%s  %s\n' \
            '21ef5b2a7fb49a5aa0ebef6e80b45d28f5421a423472c2d44cee250e697ec431' "$parts/4.rar.001" | sha256sum -c -
          printf '%s  %s\n' \
            'c59db4174e387c33612a86e5f9a8bc1961f2769f927794a4a70c72c9bc7bf0cd' "$parts/4.rar.002" | sha256sum -c -
          printf '%s  %s\n' \
            'cf32105f112fc7076f9309582711c8de1ff4184c0004788921ed30d2185e7d0a' "$parts/4.rar.003" | sha256sum -c -

      - name: Extract and audit all seven original game archives
        shell: bash
        run: |
          set -euo pipefail
          parts="$RUNNER_TEMP/richman4-parts"
          output="$RUNNER_TEMP/richman4-assets"
          mkdir -p "$output"
          cc -O2 -Wall -Wextra "$GITHUB_WORKSPACE/.github/scripts/extract-richman4-assets.c" \
            -I"$LIBARCHIVE_PREFIX/include" -L"$LIBARCHIVE_PREFIX/lib" \
            -Wl,-rpath,"$LIBARCHIVE_PREFIX/lib" -larchive -o "$RUNNER_TEMP/extract-rich4"
          "$RUNNER_TEMP/extract-rich4" "$output" \
            "$parts/4.rar.001" "$parts/4.rar.002" "$parts/4.rar.003"
          echo "RICH4_GAME_ASSETS=$output" >> "$GITHUB_ENV"
          python3 "$RUNNER_TEMP/richman4-src/scripts/audit_assets.py" "$output"
          echo "Game assets audited in temporary directory (never committed)."

      - name: Build complete, debug-signed arm64-v8a Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RICH4_SOURCE"
          chmod +x scripts/build_android.sh android/gradlew
          scripts/build_android.sh

      - name: Sign with personal Android test key and verify v1/v2/v3 certificates
        shell: bash
        env:
          RICH4_KEYSTORE_B64: ${{ secrets.RICH4_KEYSTORE_B64 }}
          RICH4_KEYSTORE_PASSWORD: ${{ secrets.RICH4_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-results"
          original="$RICH4_SOURCE/android/app/build/outputs/apk/debug/app-debug.apk"
          signed="$GITHUB_WORKSPACE/build-results/Richman4-Android-arm64-test-signed.apk"
          keystore="$RUNNER_TEMP/richman4-personal-test.p12"
          # Stable reinstall-compatible signing is possible only with the SAME
          # retained private key. Owners may configure both encrypted Actions
          # secrets (PKCS12 base64 and password). Never commit the private key
          # to this public repository or upload it as a workflow artifact.
          if [[ -n "${RICH4_KEYSTORE_B64:-}" && -n "${RICH4_KEYSTORE_PASSWORD:-}" ]]; then
            printf '%s' "$RICH4_KEYSTORE_B64" | base64 --decode > "$keystore"
            password="$RICH4_KEYSTORE_PASSWORD"
            echo "Using configured persistent personal signing key."
          else
            password="$(openssl rand -hex 24)"
            keytool -genkeypair -noprompt \
              -alias rich4-local-test \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=Richman4 Android Local Test, O=Personal Sideload, C=US" \
              -storetype PKCS12 -keystore "$keystore" \
              -storepass "$password" -keypass "$password"
            echo "No retained signing key configured; using ephemeral test key."
          fi
          chmod 600 "$keystore"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign \
            --ks "$keystore" \
            --ks-key-alias rich4-local-test \
            --ks-pass "pass:$password" --key-pass "pass:$password" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$signed" "$original"
          unset password
          # apksigner reports the scheme chosen for the requested Android API range.
          # Run three independent checks instead of demanding all 3 report true at API 28+.
          "$signer" verify --verbose --min-sdk-version 21 --max-sdk-version 23 "$signed" \
            | tee "$GITHUB_WORKSPACE/build-results/SIGNING-VERIFY-V1.txt"
          grep -Fq "Verified using v1 scheme (JAR signing): true" \
            "$GITHUB_WORKSPACE/build-results/SIGNING-VERIFY-V1.txt"
          "$signer" verify --verbose --min-sdk-version 24 --max-sdk-version 27 "$signed" \
            | tee "$GITHUB_WORKSPACE/build-results/SIGNING-VERIFY-V2.txt"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" \
            "$GITHUB_WORKSPACE/build-results/SIGNING-VERIFY-V2.txt"
          "$signer" verify --verbose --print-certs --min-sdk-version 28 "$signed" \
            | tee "$GITHUB_WORKSPACE/build-results/SIGNING-CERTIFICATE.txt"
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" \
            "$GITHUB_WORKSPACE/build-results/SIGNING-CERTIFICATE.txt"
          unzip -Z1 "$signed" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'
          test -s "$signed"
          if [[ -z "${RICH4_KEYSTORE_B64:-}" || -z "${RICH4_KEYSTORE_PASSWORD:-}" ]]; then
            echo "Test key is ephemeral; a previous build may require uninstalling."
          else
            echo "Persistent test signing key used; matching prior signed builds can update in place."
          fi

      - name: Verify APK embeds full game data and native libraries
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/build-results/Richman4-Android-arm64-test-signed.apk"
          python3 - "$apk" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path(sys.argv[1])
          with ZipFile(apk) as z:
              names = set(z.namelist())
              required = [
                  "assets/rich4-data/game/Data.mkf",
                  "assets/rich4-data/game/Effect.mkf",
                  "assets/rich4-data/game/Panel.mkf",
                  "assets/rich4-data/game/Speaking.mkf",
                  "assets/rich4-data/game/help.mkf",
                  "assets/rich4-data/game/jump.mkf",
                  "assets/rich4-data/game/map.mkf",
                  "assets/rich4-data/GeneralUser-GS.sf2",
                  "lib/arm64-v8a/libmain.so",
                  "lib/arm64-v8a/libSDL3.so",
              ]
              missing = [item for item in required if item not in names]
              mids = [item for item in names if item.startswith("assets/rich4-data/game/") and item.lower().endswith(".mid")]
              assert not missing, f"APK missing {missing}"
              assert len(mids) >= 20, f"Only {len(mids)} MIDI tracks in APK"
              print("APK contents verified:", len(required), "required files,", len(mids), "MIDI tracks")
              print("APK bytes:", apk.stat().st_size)
          PY
          mkdir -p "$GITHUB_WORKSPACE/build-results"
          (cd "$GITHUB_WORKSPACE/build-results" && sha256sum Richman4-Android-arm64-test-signed.apk > SHA256SUMS.txt)

      - name: Upload personal sideload APK (short retention, not a public Release)
        uses: actions/upload-artifact@v4
        with:
          name: Richman4-MOD-Android-arm64-test-signed-${{ github.run_number }}
          path: build-results/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
