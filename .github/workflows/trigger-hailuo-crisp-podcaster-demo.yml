name: Trigger Hailuo Crisp Podcaster Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-hailuo-crisp-podcaster-demo.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch and track demo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh workflow run build-hailuo-crisp-podcaster-demo.yml --repo "$GITHUB_REPOSITORY"
          run_id=''
          for i in $(seq 1 30); do
            sleep 3
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-hailuo-crisp-podcaster-demo.yml --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
          done
          if [[ -z "$run_id" ]]; then
            gh issue comment 119 --repo "$GITHUB_REPOSITORY" --body 'Demo dispatch sent, but no workflow run id could be resolved.'
            exit 1
          fi
          gh issue comment 119 --repo "$GITHUB_REPOSITORY" --body "Tracked demo workflow run: \`$run_id\`."
          if gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status; then
            result='PASS'
          else
            result='FAILED'
          fi
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '[.artifacts[] | {id,name,size_in_bytes,expired}]')"
          gh issue comment 119 --repo "$GITHUB_REPOSITORY" --body "Tracked demo workflow **$result**; run: \`$run_id\`; artifacts: \`$artifacts\`."
          [[ "$result" == 'PASS' ]]
