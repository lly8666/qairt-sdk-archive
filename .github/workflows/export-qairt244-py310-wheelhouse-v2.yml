name: Export QAIRT 2.44 Python 3.10 wheelhouse v2

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  export:
    if: github.event.issue.title == '[sdk-export-qairt244-py310-wheelhouse-v2]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact v2 wheelhouse from agent release index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          idx=json.load(open('release-manifest/AGENT_RELEASE_INDEX.json'))
          hits=[]
          for r in idx['releases']:
            for a in r['assets']:
              if a['name']=='qairt244-py310-wheelhouse.v2.tar':
                hits.append((r,a))
          if len(hits)!=1:
            raise SystemExit(f'expected exactly one qairt244-py310-wheelhouse.v2.tar, found {len(hits)}')
          r,a=hits[0]
          digest=(a.get('digest') or '')
          if not digest.startswith('sha256:'):
            raise SystemExit('wheelhouse asset missing sha256 digest')
          print('RELEASE_TAG='+r['tag_name'])
          print('ASSET_ID='+str(a['id']))
          print('ASSET_NAME='+a['name'])
          print('ASSET_BYTES='+str(a['size']))
          print('ASSET_SHA256='+digest.split(':',1)[1])
          PY

      - name: Download and verify immutable Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            -o "$ASSET_NAME"
          test "$(stat -c %s "$ASSET_NAME")" = "$ASSET_BYTES"
          echo "$ASSET_SHA256  $ASSET_NAME" | sha256sum -c -

      - name: Inspect and extract wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qairt244-py310-wheelhouse-v2
          tar -tf "$ASSET_NAME" > qairt244-py310-wheelhouse-v2/TAR_CONTENTS.txt
          tar -xf "$ASSET_NAME" -C qairt244-py310-wheelhouse-v2
          wheel_count="$(find qairt244-py310-wheelhouse-v2 -type f -name '*.whl' | wc -l)"
          test "$wheel_count" -gt 0
          find qairt244-py310-wheelhouse-v2 -type f -name '*.whl' -printf '%f\n' | sort > qairt244-py310-wheelhouse-v2/WHEEL_FILENAMES.txt
          cat > qairt244-py310-wheelhouse-v2/SOURCE_PROVENANCE.txt <<EOF
          source_repository=${GITHUB_REPOSITORY}
          source_release=${RELEASE_TAG}
          source_asset=${ASSET_NAME}
          source_asset_id=${ASSET_ID}
          source_bytes=${ASSET_BYTES}
          source_sha256=${ASSET_SHA256}
          wheel_count=${wheel_count}
          EOF
          (
            cd qairt244-py310-wheelhouse-v2
            find . -type f ! -name EXTRACTED_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > EXTRACTED_SHA256SUMS.txt
          )
          printf 'QAIRT244_PY310_WHEELHOUSE_V2_EXPORT_PASS wheels=%s\n' "$wheel_count"

      - name: Upload one-day connector transport
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qairt244-py310-wheelhouse-v2
          path: qairt244-py310-wheelhouse-v2
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Record artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "QAIRT 2.44 Python 3.10 wheelhouse v2 transport ready. Artifact id: \`${{ steps.upload.outputs.artifact-id }}\`; verify \`SOURCE_PROVENANCE.txt\`, \`WHEEL_FILENAMES.txt\`, and \`EXTRACTED_SHA256SUMS.txt\` after download. No compilation performed."
