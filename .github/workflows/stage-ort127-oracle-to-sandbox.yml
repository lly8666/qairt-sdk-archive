name: Stage ORT 1.27 oracle for sandbox

on:
  push:
    paths:
      - '.github/workflows/stage-ort127-oracle-to-sandbox.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  stage:
    if: github.event_name == 'push' || github.event.issue.title == '[stage-ort127-oracle-to-sandbox]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPORT_ISSUE: '105'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build portable pinned oracle site-packages
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ort127_oracle"
          mkdir -p "$root/site-packages"
          python -m pip install --disable-pip-version-check --no-cache-dir --target "$root/site-packages" \
            'numpy==1.26.4' 'onnx==1.17.0' 'onnxruntime==1.27.0'
          PYTHONPATH="$root/site-packages" python - <<'PY'
          import json, numpy, onnx, onnxruntime as ort, pathlib, sys, os
          assert numpy.__version__ == '1.26.4'
          assert onnx.__version__ == '1.17.0'
          assert ort.__version__ == '1.27.0'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ort127_oracle'
          (root/'VERSIONS.json').write_text(json.dumps({'python':sys.version,'numpy':numpy.__version__,'onnx':onnx.__version__,'onnxruntime':ort.__version__},indent=2)+'\n')
          print('ORT127_PORTABLE_ORACLE_PASS')
          PY
          cd "$root"
          find site-packages -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish portable oracle package
        uses: actions/upload-artifact@v4
        with:
          name: ort127-oracle-py311-${{ github.run_id }}
          path: ${{ runner.temp }}/ort127_oracle
          compression-level: 0
          retention-days: 1

      - name: Report staging result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = success ]; then
            printf -v body 'ORT127_SANDBOX_STAGE_PASS\n\nRun: **%s**\nPortable Python 3.11 oracle: numpy 1.26.4 / onnx 1.17.0 / onnxruntime 1.27.0. Host-only; no APK/device action.' "$GITHUB_RUN_ID"
          else
            printf -v body 'ORT127_SANDBOX_STAGE_FAIL\n\nRun: **%s**\nOracle package did not stage. No APK/device action.' "$GITHUB_RUN_ID"
          fi
          gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
