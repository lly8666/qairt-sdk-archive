name: MeanVC2 official 40+40 10s demo

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  demo40:
    if: contains(github.event.head_commit.message, '[run-40x40-demo]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Report start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 123 --repo "$GITHUB_REPOSITORY" --body "MeanVC2 official 40+40 10s demo started; workflow run ${GITHUB_RUN_ID}."

      - name: Reuse validated xvector and choose one continuous source clip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/openpack work/prev work/final
          gh run download 32562278188 --repo "$GITHUB_REPOSITORY" \
            --name MeanVC2-open-voice-pack-25-with-xvectors --dir work/openpack
          gh run download 32567613459 --repo "$GITHUB_REPOSITORY" \
            --name Chinese-crisp-podcaster-MeanVC2-long-demo --dir work/prev
          python -m pip install --disable-pip-version-check -q 'numpy<2.1' soundfile
          python - <<'PY'
          import os, shutil
          import numpy as np, soundfile as sf
          src='work/openpack/references/base_female_south_young_2.wav'
          y,sr=sf.read(src,dtype='float32',always_2d=False)
          if sr != 16000:
              raise RuntimeError(f'unexpected source sr={sr}')
          if getattr(y,'ndim',1)>1:
              y=y.mean(axis=1)
          # One uninterrupted 10.5 s slice, no joins/silence insertion.
          start=int(0.50*sr); stop=start+int(10.50*sr)
          y=y[start:stop]
          if len(y) != int(10.50*sr):
              raise RuntimeError(f'source too short: {len(y)/sr:.3f}s')
          sf.write('work/source_10p5s.wav',y,sr,subtype='PCM_16')
          emb=np.load('work/prev/Chinese_crisp_podcaster_xvector.npy').astype('float32')
          if emb.shape != (256,):
              raise RuntimeError(f'bad xvector shape {emb.shape}')
          np.save('work/final/Chinese_crisp_podcaster_xvector.npy',emb)
          shutil.copyfile('work/source_10p5s.wav','work/final/source_continuous_10p5s.wav')
          print('source_seconds',len(y)/sr,'xvector_shape',emb.shape)
          PY

      - name: Install MeanVC2 inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q \
            'torch==2.5.1' 'torchaudio==2.5.1' \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -q \
            'numpy<2.1' soundfile 'librosa>=0.10' soxr matplotlib \
            'einops==0.8.0' 'ema-pytorch==0.7.7' 'x-transformers==2.2.11' \
            'torchdiffeq==0.2.5' 'prefigure==0.0.10' safetensors \
            'huggingface_hub>=0.25'
          git clone --depth 1 https://github.com/ASLP-lab/MeanVC2.git /tmp/MeanVC2
          sed -i '/from src.model.trainer import Trainer/d' /tmp/MeanVC2/src/model/__init__.py

      - name: Download official 40+40 checkpoints from immutable MeanVC2 revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/MeanVC2/preprocess/ckpts \
                   /tmp/MeanVC2/ckpts/pretrained_models \
                   /tmp/MeanVC2/ckpts/vocos
          python - <<'PY'
          from huggingface_hub import HfApi, hf_hub_download
          import hashlib, os, shutil
          repo='ASLP-lab/MeanVC2'
          revision=HfApi().model_info(repo).sha
          pairs=[
            ('fastu2pp_80ms.pt','/tmp/MeanVC2/preprocess/ckpts/fastu2pp_80ms.pt'),
            ('meanvc2_40ms_40ms.safetensors','/tmp/MeanVC2/ckpts/pretrained_models/meanvc2_40ms_40ms.safetensors'),
            ('vocos.pt','/tmp/MeanVC2/ckpts/vocos/vocos.pt'),
          ]
          lines=[f'repository={repo}',f'revision={revision}']
          for name,dst in pairs:
              src=hf_hub_download(repo,name,revision=revision)
              shutil.copyfile(src,dst)
              h=hashlib.sha256(open(dst,'rb').read()).hexdigest()
              lines.append(f'{name} sha256={h} bytes={os.path.getsize(dst)}')
              print(name,h,os.path.getsize(dst))
          open(os.path.join(os.environ['GITHUB_WORKSPACE'],'work/final/OFFICIAL_MODEL_REVISION.txt'),'w').write('\n'.join(lines)+'\n')
          PY

      - name: Run official 40+40 MeanVC2 and crop to exact 10.000 seconds
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/MeanVC2
          python - <<'PY'
          import json, os, sys, time
          import numpy as np, soundfile as sf, torch
          sys.path.insert(0,'/tmp/MeanVC2')
          sys.path.insert(0,'/tmp/MeanVC2/src/infer')
          from infer_e2e import load_asr_model, extract_bn, vc_inference
          from dit_kvcache import DiT
          from src.model.utils import load_checkpoint

          root=os.environ['GITHUB_WORKSPACE']
          source=os.path.join(root,'work','source_10p5s.wav')
          emb=np.load(os.path.join(root,'work','final','Chinese_crisp_podcaster_xvector.npy')).astype('float32')

          asr=load_asr_model('/tmp/MeanVC2/preprocess/ckpts/fastu2pp_80ms.pt','cpu')
          t0=time.time()
          bn=extract_bn(source,asr,window=11,stride=8,offset_init=4,offset_step=2,req_cache=4).astype('float32')
          bn_seconds=time.time()-t0

          with open('/tmp/MeanVC2/src/config/config_40ms_40ms.json') as f:
              cfg=json.load(f)
          model=DiT(**cfg['model'])
          model=load_checkpoint(
              model,
              '/tmp/MeanVC2/ckpts/pretrained_models/meanvc2_40ms_40ms.safetensors',
              device='cpu',use_ema=True).float().eval()
          vocos=torch.jit.load('/tmp/MeanVC2/ckpts/vocos/vocos.pt').eval()
          torch.manual_seed(0)
          t0=time.time()
          mel,wav=vc_inference(model,vocos,bn,emb,4,4,3,'cpu')
          infer_seconds=time.time()-t0
          out=wav.cpu().squeeze().numpy().astype('float32')
          if len(out) < 160000:
              raise RuntimeError(f'converted output too short: {len(out)/16000:.3f}s')
          out=out[:160000]
          path=os.path.join(root,'work','final','Chinese_crisp_podcaster_MeanVC2_official_40ms_40ms_10s.wav')
          sf.write(path,out,16000,subtype='PCM_16')
          with open(os.path.join(root,'work','final','INFERENCE_INFO.txt'),'w') as f:
              f.write(f'model=official_40ms_40ms\nsteps=3\nchunk_size=4\nblock_size=4\n')
              f.write(f'source_seconds=10.500\noutput_seconds={len(out)/16000:.3f}\n')
              f.write(f'bn_shape={bn.shape}\nxvector_shape={emb.shape}\n')
              f.write(f'bn_extract_seconds={bn_seconds:.3f}\ninference_seconds={infer_seconds:.3f}\n')
          print('bn',bn.shape,'raw_output_seconds',wav.shape[-1]/16000,'final_seconds',len(out)/16000,'inference_seconds',infer_seconds)
          PY
          cd "$GITHUB_WORKSPACE"
          sha256sum work/final/* > work/final/SHA256SUMS.txt

      - name: Upload exact 10 second 40+40 demo
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Chinese-crisp-podcaster-MeanVC2-official-40x40-10s
          path: work/final
          compression-level: 6
          retention-days: 2
          if-no-files-found: error

      - name: Report success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 123 --repo "$GITHUB_REPOSITORY" --body "MeanVC2 official 40+40 10s demo PASS; workflow run ${GITHUB_RUN_ID}; artifact id ${{ steps.upload.outputs.artifact-id }}."

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 123 --repo "$GITHUB_REPOSITORY" --body "MeanVC2 official 40+40 10s demo FAILED; workflow run ${GITHUB_RUN_ID}."
