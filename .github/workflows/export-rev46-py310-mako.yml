name: Export rev46 Python 3.10 Mako wheels

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  export:
    if: github.event.issue.title == '[sdk-export-rev46-py310-mako]'
    runs-on: ubuntu-24.04
    steps:
      - name: Download binary-only CPython 3.10 Mako dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transport
          python3 -m pip download \
            --only-binary=:all: \
            --python-version 3.10 \
            --implementation cp \
            --abi cp310 \
            --platform manylinux2014_x86_64 \
            --dest transport \
            'Mako<2'
          test "$(find transport -maxdepth 1 -type f -name 'Mako-*.whl' | wc -l)" = 1
          find transport -maxdepth 1 -type f -name '*.whl' -printf '%f\n' | sort > transport/WHEEL_FILENAMES.txt
          (cd transport && sha256sum *.whl > SHA256SUMS.txt)
          cat > transport/SOURCE_PROVENANCE.txt <<'EOF'
          source=pypi
          requirement=Mako<2
          python=cp310
          platform=manylinux2014_x86_64
          mode=binary-wheel-transport-only
          EOF
          cat transport/SOURCE_PROVENANCE.txt
          cat transport/WHEEL_FILENAMES.txt
          cat transport/SHA256SUMS.txt

      - name: Upload one-day connector transport
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: rev46-py310-mako
          path: transport
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Record artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "rev46 CPython 3.10 Mako dependency transport ready. Artifact id: \`${{ steps.upload.outputs.artifact-id }}\`. Binary wheel transport only; no project compilation performed. Verify SOURCE_PROVENANCE.txt, WHEEL_FILENAMES.txt, and SHA256SUMS.txt after download."
