name: Build Hailuo Crisp Podcaster MeanVC2 Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-hailuo-crisp-podcaster-demo.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  demo:
    if: github.event_name != 'issues' || github.event.issue.title == '[build-hailuo-crisp-podcaster-demo-direct]'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_URL: https://cdn.hailuoai.com/hailuo-video-web/public_assets/Chinese_crisp_podcaster.mp3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Report started
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 119 --repo "$GITHUB_REPOSITORY" --body "Hailuo crisp-podcaster demo started; run: \`${GITHUB_RUN_ID}\`."

      - name: Download and prepare target reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/final
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            -A 'Mozilla/5.0' -H 'Referer: https://hailuoai.com/' \
            "$TARGET_URL" -o work/target.mp3
          test -s work/target.mp3
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 work/target.mp3 | tee work/target_probe.txt
          ffmpeg -hide_banner -loglevel error -y -i work/target.mp3 \
            -ac 1 -ar 16000 -af 'highpass=f=60,loudnorm=I=-20:TP=-2:LRA=11' \
            work/target.wav
          sha256sum work/target.mp3 work/target.wav | tee work/TARGET_SHA256SUMS.txt

      - name: Build a long open-license Mandarin source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'huggingface_hub>=0.25' 'numpy<2.1' scipy soundfile
          python - <<'PY'
          from collections import defaultdict
          from math import gcd
          import numpy as np
          import soundfile as sf
          from scipy.signal import resample_poly
          from huggingface_hub import HfApi, hf_hub_download

          repo='AISHELL/AISHELL-3'
          api=HfApi()
          files=api.list_repo_files(repo, repo_type='dataset')
          wavs=[p for p in files if p.lower().endswith('.wav') and '/SSB' in p]
          by=defaultdict(list)
          for p in wavs:
              parts=p.split('/')
              if len(parts)>=2 and parts[-2].startswith('SSB'):
                  by[parts[-2]].append(p)
          spk=max(sorted(by), key=lambda s: len(by[s]))
          cand=sorted(by[spk])
          sr_out=16000
          silence=np.zeros(int(0.14*sr_out),np.float32)
          pieces=[]; used=[]; total=0.0
          for remote in cand:
              local=hf_hub_download(repo, remote, repo_type='dataset')
              y,sr=sf.read(local, always_2d=False)
              if getattr(y,'ndim',1)>1: y=np.mean(y,axis=1)
              y=np.asarray(y,np.float32)
              if y.size==0: continue
              peak=float(np.max(np.abs(y)))
              if peak<=1e-7: continue
              thr=peak*0.02
              idx=np.flatnonzero(np.abs(y)>thr)
              if idx.size:
                  pad=int(0.06*sr)
                  a=max(0,int(idx[0])-pad); b=min(len(y),int(idx[-1])+pad)
                  y=y[a:b]
              if sr!=sr_out:
                  g=gcd(int(sr),sr_out)
                  y=resample_poly(y,sr_out//g,int(sr)//g).astype(np.float32)
              if len(y)<int(0.5*sr_out): continue
              p=float(np.max(np.abs(y)))
              if p>0: y=y/p*0.82
              if pieces: pieces.append(silence)
              pieces.append(y); used.append(remote)
              total=sum(len(x) for x in pieces)/sr_out
              if total>=46.0: break
          if not used: raise RuntimeError('No usable AISHELL-3 source wavs')
          out=np.concatenate(pieces)[:int(46*sr_out)]
          sf.write('work/source.wav',out,sr_out,subtype='PCM_16')
          with open('work/source_info.txt','w',encoding='utf-8') as f:
              f.write(f'dataset={repo}\nlicense=Apache-2.0\nspeaker={spk}\nduration_s={len(out)/sr_out:.3f}\n')
              f.write('\n'.join(used))
          print('source speaker',spk,'files',len(used),'duration',len(out)/sr_out)
          PY
          ffprobe -v error -show_entries format=duration -of default=nw=1 work/source.wav | tee -a work/source_info.txt

      - name: Install MeanVC2 inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'torch==2.5.1' 'torchaudio==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -q \
            'numpy<2.1' soundfile 'librosa>=0.10' soxr matplotlib \
            einops ema-pytorch x-transformers torchdiffeq prefigure safetensors \
            's3prl==0.4.18' 'huggingface_hub>=0.25'
          git clone --depth 1 https://github.com/ASLP-lab/MeanVC2.git /tmp/MeanVC2

      - name: Download MeanVC2 checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/MeanVC2/preprocess/ckpts /tmp/MeanVC2/ckpts/pretrained_models /tmp/MeanVC2/ckpts/vocos
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil
          pairs=[
            ('ASLP-lab/MeanVC2','fastu2pp_160ms.pt','/tmp/MeanVC2/preprocess/ckpts/fastu2pp_160ms.pt'),
            ('ASLP-lab/MeanVC2','meanvc2_120ms_40ms.safetensors','/tmp/MeanVC2/ckpts/pretrained_models/meanvc2_120ms_40ms.safetensors'),
            ('ASLP-lab/MeanVC2','vocos.pt','/tmp/MeanVC2/ckpts/vocos/vocos.pt'),
            ('s3prl/converted_ckpts','wavlm_large.pt','/tmp/MeanVC2/preprocess/ckpts/wavlm_large.pt'),
            ('lmzjms/wavlm-large','wavlm_large_finetune.pth','/tmp/MeanVC2/preprocess/ckpts/wavlm_large_finetune.pth'),
          ]
          for repo,name,dst in pairs:
              src=hf_hub_download(repo,name)
              shutil.copyfile(src,dst)
              print(name,'->',dst)
          PY
          echo '6fb4b3c3e6aa567f0a997b30855859cb81528ee8078802af439f7b2da0bf100f  /tmp/MeanVC2/preprocess/ckpts/wavlm_large.pt' | sha256sum -c -
          echo '51f07e3b94d9e0262a6a675ef5a087be3dd09e8c62e9d886827f44f82fe7f94b  /tmp/MeanVC2/preprocess/ckpts/wavlm_large_finetune.pth' | sha256sum -c -

      - name: Convert long sample to target timbre
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/MeanVC2
          python src/infer/infer_e2e.py \
            --model 120ms \
            --source-wav "$GITHUB_WORKSPACE/work/source.wav" \
            --target-wav "$GITHUB_WORKSPACE/work/target.wav" \
            --output-wav "$GITHUB_WORKSPACE/work/converted_raw.wav" \
            --steps 3 --device cpu
          cd "$GITHUB_WORKSPACE"
          ffmpeg -hide_banner -loglevel error -y -i work/converted_raw.wav \
            -af 'highpass=f=55,loudnorm=I=-18:TP=-1.5:LRA=11' \
            -ar 16000 -ac 1 work/final/Chinese_crisp_podcaster_MeanVC2_long_demo.wav
          ffmpeg -hide_banner -loglevel error -y -i work/final/Chinese_crisp_podcaster_MeanVC2_long_demo.wav \
            -c:a libmp3lame -b:a 192k work/final/Chinese_crisp_podcaster_MeanVC2_long_demo.mp3
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 work/final/Chinese_crisp_podcaster_MeanVC2_long_demo.wav | tee work/final/OUTPUT_INFO.txt

      - name: Save target speaker embedding
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/MeanVC2
          python - <<'PY'
          import os, sys, numpy as np
          sys.path.insert(0,'/tmp/MeanVC2')
          from src.infer.infer_e2e import load_spk_model, extract_spk_emb
          wav=os.path.join(os.environ['GITHUB_WORKSPACE'],'work','target.wav')
          out=os.path.join(os.environ['GITHUB_WORKSPACE'],'work','final','Chinese_crisp_podcaster_xvector.npy')
          model=load_spk_model('cpu')
          emb=extract_spk_emb(wav,model,'cpu').astype('float32')
          if emb.shape != (256,): raise RuntimeError(emb.shape)
          np.save(out,emb)
          print('saved',out,'shape',emb.shape,'norm',float(np.linalg.norm(emb)))
          PY
          cd "$GITHUB_WORKSPACE"
          cp work/target.mp3 work/final/reference_original.mp3
          cp work/target.wav work/final/reference_16k.wav
          cp work/source.wav work/final/source_open_license.wav
          cp work/source_info.txt work/final/SOURCE_INFO.txt
          cp work/TARGET_SHA256SUMS.txt work/final/
          sha256sum work/final/* > work/final/SHA256SUMS.txt

      - name: Upload demo artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Hailuo-Chinese-crisp-podcaster-MeanVC2-demo
          path: work/final
          compression-level: 6
          retention-days: 14
          if-no-files-found: error

      - name: Report success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 119 --repo "$GITHUB_REPOSITORY" --body "Hailuo crisp-podcaster demo **PASS**; run: \`${GITHUB_RUN_ID}\`; artifact: **Hailuo-Chinese-crisp-podcaster-MeanVC2-demo** (id \`${{ steps.upload.outputs.artifact-id }}\`)."

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 119 --repo "$GITHUB_REPOSITORY" --body "Hailuo crisp-podcaster demo **FAILED**; run: \`${GITHUB_RUN_ID}\`. Inspect the failing step."
