name: Build TAS-AN00 GhostLock native ARM64 experimental core

on:
  pull_request:
    paths:
      - '.github/workflows/emui11-tas-native-port.yml'
      - 'emui11-tas/native-port/**'
      - 'emui11-tas/ghostlock-root-test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact MIT-licensed 4.14 reference
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch main https://github.com/BellezaEmporium/ghostlock-bkl-l09.git "$RUNNER_TEMP/ghostlock-ref"
          test "$(git -C "$RUNNER_TEMP/ghostlock-ref" rev-parse HEAD)" = '381476444fbbbcf0c5e8e3c2e2166647e9134ab5'
          mkdir -p out
          cp "$RUNNER_TEMP/ghostlock-ref/LICENSE" out/UPSTREAM_LICENSE.txt
          python3 emui11-tas/native-port/build_tas_source.py \
            "$RUNNER_TEMP/ghostlock-ref/exploit/ghostlock_mrx_e.c" out/ghostlock_tas_port.c
          sha256sum out/ghostlock_tas_port.c | tee out/PORT_SOURCE_SHA256.txt
      - name: Obtain verified Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/android-ndk-r27c"
          if test ! -x "$dir/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"; then
            curl -fLsS --retry 3 'https://dl.google.com/android/repository/android-ndk-r27c-linux.zip' \
              -o "$RUNNER_TEMP/android-ndk-r27c-linux.zip"
            printf '%s  %s\n' '090e8083a715fdb1a3e402d0763c388abb03fb4e' "$RUNNER_TEMP/android-ndk-r27c-linux.zip" | sha1sum -c
            unzip -q "$RUNNER_TEMP/android-ndk-r27c-linux.zip" \
              'android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/*' -d "$RUNNER_TEMP"
          fi
          echo "NDK=$dir" >> "$GITHUB_ENV"
      - name: Compile experimental ARM64 binary
        shell: bash
        run: |
          set +e
          root="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$root/aarch64-linux-android29-clang" -std=gnu11 -O2 -g0 -pthread \
            -fPIE -pie -fstack-protector-strong -Wno-unused-function \
            -Wl,-z,relro,-z,now -o out/ghostlock_tas_an00_arm64 out/ghostlock_tas_port.c \
            >out/compile-stdout.log 2>out/compile-stderr.log
          status=$?
          printf 'compile_status=%s\n' "$status" | tee out/COMPILE_STATUS.txt
          if test "$status" -ne 0; then cat out/compile-stderr.log | tail -80; exit 1; fi
          file out/ghostlock_tas_an00_arm64 > out/EXECUTABLE_FILE.txt
          readelf -h out/ghostlock_tas_an00_arm64 > out/EXECUTABLE_ELF_HEADER.txt
          readelf -l out/ghostlock_tas_an00_arm64 > out/EXECUTABLE_ELF_PROGRAMS.txt
          readelf -d out/ghostlock_tas_an00_arm64 > out/EXECUTABLE_DYNAMIC.txt
          grep -q AArch64 out/EXECUTABLE_ELF_HEADER.txt
          grep -q 'DYN (Position-Independent Executable file)' out/EXECUTABLE_ELF_HEADER.txt
          sha256sum out/ghostlock_tas_an00_arm64 > out/EXECUTABLE_SHA256.txt
          printf '%s\n' \
            'TAS-AN00 11.0.0.185 (4.14.116) experimental binary' \
            'Reference: BellezaEmporium/ghostlock-bkl-l09@381476444fbbbcf0c5e8e3c2e2166647e9134ab5' \
            'Android API29 / arm64-v8a' \
            'Root ability not tested, app domain may deny perf/mount' \
            'This code may crash or panic the kernel; use only on disposable device.' \
            > out/BUILD_NOTES.txt
          cat out/EXECUTABLE_FILE.txt
          cat out/EXECUTABLE_SHA256.txt
      - name: Compile 13-case isolated Android10 KASLR diagnostic core
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$toolchain/aarch64-linux-android29-clang" -std=gnu11 -O2 -g0 \
            -Wall -Wextra -Werror -fstack-protector-strong -fPIE -pie \
            -Wl,-z,relro,-z,now \
            -o out/tas_batchprobe_arm64 \
            emui11-tas/ghostlock-root-test/native/tas_batch_probe.c
          file out/tas_batchprobe_arm64 | tee out/BATCH_EXECUTABLE_FILE.txt
          readelf -h out/tas_batchprobe_arm64 > out/BATCH_EXECUTABLE_ELF_HEADER.txt
          grep -q AArch64 out/BATCH_EXECUTABLE_ELF_HEADER.txt
          sha256sum out/tas_batchprobe_arm64 > out/BATCH_SHA256.txt
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -o "$RUNNER_TEMP/tas_batchprobe_host" \
            emui11-tas/ghostlock-root-test/native/tas_batch_probe.c
          "$RUNNER_TEMP/tas_batchprobe_host" --batch > out/BATCH_HOST_SMOKE_TEST.txt
          grep -q '^case_count=13$' out/BATCH_HOST_SMOKE_TEST.txt
          grep -q '^TAS_KASLR_BATCH_V1_END$' out/BATCH_HOST_SMOKE_TEST.txt
          test "$(grep -c '^CASE_END=' out/BATCH_HOST_SMOKE_TEST.txt)" -eq 13
      - name: Set up Java 17 and Gradle 8.7 for root test APK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Use runner Android SDK build platform 35
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          if test ! -e "$sdk/platforms/android-35/android.jar" || test ! -x "$sdk/build-tools/35.0.0/aapt"; then
            sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            "$sdkmanager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -e "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/apksigner"
      - name: Embed verified native binary into TAS test APK
        shell: bash
        run: |
          set -euo pipefail
          assets=emui11-tas/ghostlock-root-test/app/src/main/assets
          mkdir -p "$assets"
          cp out/ghostlock_tas_an00_arm64 "$assets/ghostlock_tas_an00_arm64"
          cp out/tas_batchprobe_arm64 "$assets/tas_batchprobe_arm64"
          sha256sum out/tas_batchprobe_arm64 | cut -d' ' -f1 > "$assets/tas_batchprobe.sha256"
          sha256sum out/ghostlock_tas_an00_arm64 | cut -d' ' -f1 > "$assets/ghostlock_tas.sha256"
          cp out/UPSTREAM_LICENSE.txt "$assets/UPSTREAM_LICENSE.txt"
          test "$(wc -c < "$assets/ghostlock_tas.sha256")" -eq 65
      - name: Build signed GhostLock TAS-AN00 root research APK
        shell: bash
        run: |
          set -euo pipefail
          cd emui11-tas/ghostlock-root-test
          gradle --no-daemon --max-workers=2 :app:assembleDebug
      - name: Verify APK native asset, permissions and signing
        shell: bash
        run: |
          set -euo pipefail
          root=emui11-tas/ghostlock-root-test
          apk="$root/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$aapt" dump badging "$apk" > out/ROOTLAB_BADGING.txt
          "$apksigner" verify --verbose "$apk" > out/ROOTLAB_SIGNATURE.txt
          unzip -l "$apk" > out/ROOTLAB_CONTENTS.txt
          grep -q "package: name='io.github.tasaudit.ghostlockrootlab.v02'" out/ROOTLAB_BADGING.txt
          grep -q "sdkVersion:'29'" out/ROOTLAB_BADGING.txt
          grep -q "targetSdkVersion:'27'" out/ROOTLAB_BADGING.txt
          ! grep -q '^uses-permission' out/ROOTLAB_BADGING.txt
          grep -q 'assets/ghostlock_tas_an00_arm64' out/ROOTLAB_CONTENTS.txt
          grep -q 'assets/ghostlock_tas.sha256' out/ROOTLAB_CONTENTS.txt
          grep -q 'assets/tas_batchprobe_arm64' out/ROOTLAB_CONTENTS.txt
          grep -q 'assets/tas_batchprobe.sha256' out/ROOTLAB_CONTENTS.txt
          grep -q 'Verified using v2 scheme' out/ROOTLAB_SIGNATURE.txt
          cp "$apk" out/TAS_GhostLock_RootLab_v0_2-debug.apk
          sha256sum out/TAS_GhostLock_RootLab_v0_2-debug.apk > out/ROOTLAB_APK_SHA256.txt
          echo 'NOT ON-DEVICE ROOT VERIFIED: batched perf failure investigation and signed APK only.' > out/ROOTLAB_STATUS.txt
          cat out/ROOTLAB_APK_SHA256.txt
          cat out/ROOTLAB_BADGING.txt | head -20
          cat out/ROOTLAB_SIGNATURE.txt
      - name: Upload code, ARM64 executable, and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tas-an00-ghostlock-rootlab-batch-v0_2
          path: out/
          retention-days: 7
          if-no-files-found: error
