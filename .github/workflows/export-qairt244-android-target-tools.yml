name: Export QAIRT 2.44 Android HTP target tools

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  export:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[sdk-export-qairt244-android-target-tools]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve QAIRT 2.44 SDK asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          idx=json.load(open('release-manifest/AGENT_RELEASE_INDEX.json'))
          hits=[]
          for rel in idx['releases']:
              for asset in rel['assets']:
                  if asset['name']=='QAIRT.v2.44.0.260225.zip':
                      hits.append((rel,asset))
          if len(hits)!=1:
              raise SystemExit(f'expected exactly one QAIRT 2.44 SDK asset, found {len(hits)}')
          rel,a=hits[0]
          digest=a.get('digest') or ''
          if not digest.startswith('sha256:'):
              raise SystemExit('missing indexed sha256 digest')
          print('QAIRT_RELEASE_TAG='+rel['tag_name'])
          print('QAIRT_ASSET_NAME='+a['name'])
          print('QAIRT_ASSET_ID='+str(a['id']))
          print('QAIRT_ASSET_BYTES='+str(a['size']))
          print('QAIRT_ASSET_SHA256='+digest.split(':',1)[1])
          print('QAIRT_BROWSER_URL='+a['browser_download_url'])
          PY

      - name: Download and verify SDK
        shell: bash
        run: |
          set -euo pipefail
          # qairt-sdk-archive is the public reusable workspace. Use the ordinary
          # public Release URL first; keep authenticated API fallback for repository
          # visibility propagation/cache edge cases.
          if ! curl --retry 3 --retry-delay 2 -fL "$QAIRT_BROWSER_URL" -o "$QAIRT_ASSET_NAME"; then
            curl --retry 3 --retry-delay 2 -fL \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H 'Accept: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${QAIRT_ASSET_ID}" \
              -o "$QAIRT_ASSET_NAME"
          fi
          test "$(stat -c %s "$QAIRT_ASSET_NAME")" = "$QAIRT_ASSET_BYTES"
          actual="$(sha256sum "$QAIRT_ASSET_NAME" | awk '{print $1}')"
          test "$actual" = "$QAIRT_ASSET_SHA256"
          echo "QAIRT_SDK_VERIFY_PASS bytes=$QAIRT_ASSET_BYTES sha256=$actual"

      - name: Inventory and extract Android HTP target subset
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$QAIRT_ASSET_NAME" <<'PY'
          import hashlib, json, os, shutil, sys, zipfile
          src=sys.argv[1]
          out='qairt244-android-htp-target-tools'
          os.makedirs(out,exist_ok=True)
          selected=[]
          inventory=[]

          def wanted(rel):
              s='/'+rel.replace('\\','/').lstrip('/')
              low=s.lower()
              # Target executable and Android target runtime/stubs.
              if '/bin/aarch64-android/' in low:
                  return True
              if '/lib/aarch64-android/' in low:
                  return True
              # All Hexagon variants are preserved; choose DSP arch only on the device.
              if '/lib/hexagon-' in low:
                  base=os.path.basename(low)
                  if ('qnnhtp' in base and ('skel' in base or base.endswith('.so'))) or 'optrace' in base:
                      return True
              # Small config/examples used to identify backend-extension syntax.
              if '/share/qnn/' in low and any(k in low for k in ('htp','backend','optrace','profil')):
                  return True
              return False

          with zipfile.ZipFile(src) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  parts=[p for p in info.filename.replace('\\','/').split('/') if p]
                  marker=None
                  for i,p in enumerate(parts):
                      if p in ('bin','lib','share'):
                          marker=i; break
                  if marker is None:
                      continue
                  rel='/'.join(parts[marker:])
                  if not wanted(rel):
                      continue
                  dst=os.path.join(out,rel)
                  os.makedirs(os.path.dirname(dst),exist_ok=True)
                  h=hashlib.sha256()
                  with z.open(info) as r, open(dst,'wb') as w:
                      while True:
                          b=r.read(1024*1024)
                          if not b: break
                          h.update(b); w.write(b)
                  item={'source':info.filename,'path':rel,'bytes':info.file_size,'sha256':h.hexdigest()}
                  selected.append(item)
                  inventory.append(rel)

          def hits(fragment):
              f=fragment.lower()
              return [x for x in inventory if f in x.lower()]

          required={
              'qnn-net-run': [x for x in inventory if x.endswith('/qnn-net-run') and '/aarch64-android/' in x],
              'libQnnHtp.so': [x for x in inventory if x.endswith('/libQnnHtp.so') and '/aarch64-android/' in x],
              'libQnnSystem.so': [x for x in inventory if x.endswith('/libQnnSystem.so') and '/aarch64-android/' in x],
              'HTP Stub': [x for x in inventory if '/aarch64-android/' in x and 'stub' in os.path.basename(x).lower() and 'qnnhtp' in os.path.basename(x).lower()],
              'HTP Skel': [x for x in inventory if '/hexagon-' in x.lower() and 'skel' in os.path.basename(x).lower() and 'qnnhtp' in os.path.basename(x).lower()],
          }
          missing=[k for k,v in required.items() if not v]
          if missing:
              print(json.dumps({'required':required},indent=2))
              raise SystemExit('missing target requirements: '+', '.join(missing))

          archs=sorted({x.split('/')[1] for x in inventory if x.lower().startswith('lib/hexagon-')})
          manifest={
              'schema':1,
              'sdk':'QAIRT 2.44.0.260225',
              'policy':'extract every available Hexagon HTP skel; do not guess target DSP architecture offline',
              'required_hits':required,
              'hexagon_variants':archs,
              'files':selected,
              'total_files':len(selected),
              'total_bytes':sum(x['bytes'] for x in selected),
          }
          with open(os.path.join(out,'ANDROID_TARGET_INVENTORY.json'),'w') as f:
              json.dump(manifest,f,indent=2,sort_keys=True)
          print(json.dumps({k:v for k,v in manifest.items() if k!='files'},indent=2))
          PY

          cat > qairt244-android-htp-target-tools/SOURCE_PROVENANCE.txt <<EOF
          source_repository=${GITHUB_REPOSITORY}
          source_release=${QAIRT_RELEASE_TAG}
          source_asset=${QAIRT_ASSET_NAME}
          source_asset_id=${QAIRT_ASSET_ID}
          source_bytes=${QAIRT_ASSET_BYTES}
          source_sha256=${QAIRT_ASSET_SHA256}
          workflow_commit=${GITHUB_SHA}
          purpose=Android/HTP target structural-capture tool subset; no model and no device result
          EOF
          (
            cd qairt244-android-htp-target-tools
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Upload short-lived target bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: qairt244-android-htp-target-tools
          path: qairt244-android-htp-target-tools
          compression-level: 6
          retention-days: 3
          if-no-files-found: error

      - name: Report artifact
        if: github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "QAIRT 2.44 Android/HTP target subset is ready. Artifact id: \`${{ steps.upload.outputs.artifact-id }}\`; name: \`qairt244-android-htp-target-tools\`; retention: 3 days. Inspect \`ANDROID_TARGET_INVENTORY.json\`; it deliberately preserves every available Hexagon HTP skel instead of guessing the target DSP architecture. No model/device data is included."
