name: Stage rev46 authority host assets

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  stage:
    if: github.event.issue.title == '[stage-rev46-authority-host-assets]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APK_ASSET_ID: '522156340'
      APK_BYTES: '147639670'
      APK_SHA256: 'f0041f9994413b3fac496612bd15e3da922c4b6ff3712da51d81326b717dc86c'
    steps:
      - name: Download exact public release APK and extract host authority subset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p stage/base stage/rev25 stage/fixtures stage/meta
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${APK_ASSET_ID}" -o authority.apk
          test "$(stat -c %s authority.apk)" = "$APK_BYTES"
          echo "$APK_SHA256  authority.apk" | sha256sum -c -
          unzip -p authority.apk assets/models/vocos_gate0c_cold4.onnx > stage/base/vocos_gate0c_cold4.onnx
          unzip -p authority.apk assets/models/vocos_gate0c_warm6.onnx > stage/base/vocos_gate0c_warm6.onnx
          unzip -p authority.apk assets/patches/rev25/vocos_gate0c_cold4_rev25_b0123567.patch.json > stage/rev25/cold.patch.json
          unzip -p authority.apk assets/patches/rev25/vocos_gate0c_warm6_rev25_b0123567.patch.json > stage/rev25/warm.patch.json
          unzip -p authority.apk assets/fixtures/file2file_expected_raw_mel_48x1x80x4_f32le.bin > stage/fixtures/file2file_expected_raw_mel_48x1x80x4_f32le.bin
          unzip -p authority.apk assets/fixtures/file2file_fixture_manifest.json > stage/fixtures/file2file_fixture_manifest.json
          echo 'd32cb4b116bfe6aeee12f2ab726cf617b3aca6e8043bdf4d533c843769e00a7f  stage/base/vocos_gate0c_cold4.onnx' | sha256sum -c -
          echo '5981bfc5d6850baaef7f44af2da18ecd149782e0ffcabf731bcf658d953e0909  stage/base/vocos_gate0c_warm6.onnx' | sha256sum -c -
          echo '25170399554d351158c9d96753f05feceb429fbf9b4acba12b7214f99b3ba44a  stage/rev25/cold.patch.json' | sha256sum -c -
          echo 'b7426abd298106cd256e7e6bd4498d032e2fc89b630d67821b827af8d4646988  stage/rev25/warm.patch.json' | sha256sum -c -
          echo 'dc58af153c7c0dd6ab0a450a5f77648203e7f82a800a17837e09095ce48c9963  stage/fixtures/file2file_expected_raw_mel_48x1x80x4_f32le.bin' | sha256sum -c -
          echo 'e0d8d2142cc346ecda782f50651af68d09f45eae5037f90525f426b693a13251  stage/fixtures/file2file_fixture_manifest.json' | sha256sum -c -
          cat > stage/meta/AUTHORITY.txt <<EOF
          source_repo=${GITHUB_REPOSITORY}
          source_release=20260820.2
          source_asset_id=${APK_ASSET_ID}
          source_apk_bytes=${APK_BYTES}
          source_apk_sha256=${APK_SHA256}
          purpose=host-only rev46 recovery after sandbox reset
          device_run=false
          apk_build=false
          EOF
          (cd stage && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload authority subset
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: rev46-authority-host-assets-${{ github.run_id }}
          path: stage
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Report result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s stage/base/vocos_gate0c_warm6.onnx ]; then
            body="REV46_AUTHORITY_HOST_ASSETS_STAGE_PASS\n\nRun: **${GITHUB_RUN_ID}**\nArtifact id: **${{ steps.upload.outputs.artifact-id }}**\nExact release APK authority subset SHA-verified. Host-only; no APK build/device action."
          else
            body="REV46_AUTHORITY_HOST_ASSETS_STAGE_FAIL\n\nRun: **${GITHUB_RUN_ID}**\nNo model execution/APK/device action."
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
