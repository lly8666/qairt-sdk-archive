name: Build TAS-AN00 Stage-1 read-only feasibility verifier APK

on:
  pull_request:
    paths:
      - '.github/workflows/emui11-tas-runtime-inventory-apk.yml'
      - 'emui11-tas/runtime-inventory/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17 and Gradle 8.7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Select preinstalled Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/apksigner"
      - name: Resolve pinned NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/android-ndk-r27c"
          if test ! -x "$base/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"; then
            curl -fLsS --retry 3 \
              'https://dl.google.com/android/repository/android-ndk-r27c-linux.zip' \
              -o "$RUNNER_TEMP/android-ndk-r27c-linux.zip"
            printf '%s  %s\n' \
              '090e8083a715fdb1a3e402d0763c388abb03fb4e' \
              "$RUNNER_TEMP/android-ndk-r27c-linux.zip" | sha1sum -c
            unzip -q "$RUNNER_TEMP/android-ndk-r27c-linux.zip" \
              'android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/*' \
              -d "$RUNNER_TEMP"
          fi
          echo "NDK=$base" >> "$GITHUB_ENV"
      - name: Compile native ARM64 safe GPU ABI version probe JNI
        shell: bash
        run: |
          set -euo pipefail
          dir=emui11-tas/runtime-inventory
          dest="$dir/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$dest" out
          compiler="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          "$compiler" -std=gnu11 -O2 -Wall -Wextra -Werror -fPIC -shared \
            -Wl,-z,relro,-z,now \
            -o "$dest/libtas_mali_abi.so" \
            "$dir/native/tas_mali_abi.c"
          file "$dest/libtas_mali_abi.so" | tee out/MALI_JNI_FILE.txt
          readelf -h "$dest/libtas_mali_abi.so" > out/MALI_JNI_ELF_HEADER.txt
          readelf -Ws "$dest/libtas_mali_abi.so" > out/MALI_JNI_SYMBOLS.txt
          grep -q AArch64 out/MALI_JNI_ELF_HEADER.txt
          grep -q Java_io_github_tasaudit_runtimeinventory_ProbeCollector_probeMaliNative out/MALI_JNI_SYMBOLS.txt
          sha256sum "$dest/libtas_mali_abi.so" > out/MALI_JNI_SHA256.txt
      - name: Compile pinned Mali 11.16 MEM_ALLOC / MEM_IMPORT batch and local cache canary
        shell: bash
        run: |
          set -euo pipefail
          dir=emui11-tas/runtime-inventory
          compiler="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          "$compiler" -std=gnu11 -O2 -Wall -Wextra -Werror \
            -fstack-protector-strong -fPIE -pie -Wl,-z,relro,-z,now \
            -o out/tas_mali_batch_arm64 "$dir/native/tas_mali_batch.c"
          file out/tas_mali_batch_arm64 > out/MALI_BATCH_FILE.txt
          readelf -h out/tas_mali_batch_arm64 > out/MALI_BATCH_ELF_HEADER.txt
          grep -q AArch64 out/MALI_BATCH_ELF_HEADER.txt
          cc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -o "$RUNNER_TEMP/tas_mali_batch_host" "$dir/native/tas_mali_batch.c"
          if "$RUNNER_TEMP/tas_mali_batch_host" >out/MALI_BATCH_HOST_USAGE.txt 2>&1; then
            echo "no-argument guard unexpectedly returned zero" >&2
            exit 1
          fi
          grep -q 'usage: tas_mali_batch --batch' out/MALI_BATCH_HOST_USAGE.txt
          mkdir -p "$dir/app/src/main/assets"
          cp out/tas_mali_batch_arm64 "$dir/app/src/main/assets/tas_mali_batch_arm64"
          sha256sum out/tas_mali_batch_arm64 | cut -d' ' -f1 \
            > "$dir/app/src/main/assets/tas_mali_batch.sha256"
          sha256sum out/tas_mali_batch_arm64 | tee out/MALI_BATCH_SHA256.txt
      - name: Validate service-survey ADB collector smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 emui11-tas/tools/tas_service_context_collect.py --selftest             | tee out/SERVICE_CONTEXT_COLLECTOR_SMOKE.txt
          python3 -m py_compile emui11-tas/tools/tas_service_context_collect.py
          cp emui11-tas/tools/tas_service_context_collect.py out/tas_service_context_collect.py
          python3 emui11-tas/tools/tas_context_decision.py --selftest \
            | tee out/SERVICE_CONTEXT_DECISION_SMOKE.txt
          cp emui11-tas/tools/tas_context_decision.py out/tas_context_decision.py
      - name: Stage-1 evidence logic regression checks (pure Java, no device)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tas-stage1-classes"
          javac -d "$RUNNER_TEMP/tas-stage1-classes" \
            emui11-tas/runtime-inventory/app/src/main/java/io/github/tasaudit/runtimeinventory/StageOneReadiness.java \
            emui11-tas/runtime-inventory/tools/StageOneReadinessTest.java
          java -cp "$RUNNER_TEMP/tas-stage1-classes" StageOneReadinessTest | tee out/STAGE1_READONLY_SELFTEST.txt
          grep -q 'STAGE1_READONLY_PREFLIGHT_SELFTEST_PASS count=5' out/STAGE1_READONLY_SELFTEST.txt
      - name: Build installable Android 10 diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          (cd emui11-tas/runtime-inventory && gradle --no-daemon --max-workers=2 :app:assembleDebug)
      - name: Check APK is signed and declares no permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=emui11-tas/runtime-inventory/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > out/APK_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" > out/APK_SIGNATURE.txt
          unzip -l "$apk" > out/APK_CONTENTS.txt
          grep -q "package: name='io.github.tasaudit.runtimeinventory.stage1v14'" out/APK_BADGING.txt
          grep -q "sdkVersion:'29'" out/APK_BADGING.txt
          grep -q "targetSdkVersion:'27'" out/APK_BADGING.txt
          ! grep -q '^uses-permission' out/APK_BADGING.txt
          grep -q 'lib/arm64-v8a/libtas_mali_abi.so' out/APK_CONTENTS.txt
          grep -q 'assets/tas_mali_batch_arm64' out/APK_CONTENTS.txt
          grep -q 'assets/tas_mali_batch.sha256' out/APK_CONTENTS.txt
          grep -q 'Verified using v2 scheme' out/APK_SIGNATURE.txt
          cp "$apk" out/TAS_AN00_Stage1_ReadOnly_Verifier_v1_4-debug.apk
          sha256sum out/TAS_AN00_Stage1_ReadOnly_Verifier_v1_4-debug.apk > out/APK_SHA256.txt
          echo "v1.4 Stage-1 preflight: readonly ABI + target identity, fail-closed interpretation; protected page modification, exploit, privileged execution and Root are NOT tested. Optional legacy app-private GPU canary requires explicit confirmation." > out/SECURITY_SCOPE.txt
          cat out/APK_SHA256.txt
      - name: Publish APK, SHA256 and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAS-AN00-Stage1-ReadOnly-Verifier-v1_4
          path: out/
          retention-days: 7
          if-no-files-found: error
