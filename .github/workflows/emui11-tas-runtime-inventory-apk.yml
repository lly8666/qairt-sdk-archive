name: Build TAS-AN00 read-only runtime file/Mali ABI inventory APK

on:
  pull_request:
    paths:
      - '.github/workflows/emui11-tas-runtime-inventory-apk.yml'
      - 'emui11-tas/runtime-inventory/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17 and Gradle 8.7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Select preinstalled Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/apksigner"
      - name: Resolve pinned NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/android-ndk-r27c"
          if test ! -x "$base/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"; then
            curl -fLsS --retry 3 \
              'https://dl.google.com/android/repository/android-ndk-r27c-linux.zip' \
              -o "$RUNNER_TEMP/android-ndk-r27c-linux.zip"
            printf '%s  %s\n' \
              '090e8083a715fdb1a3e402d0763c388abb03fb4e' \
              "$RUNNER_TEMP/android-ndk-r27c-linux.zip" | sha1sum -c
            unzip -q "$RUNNER_TEMP/android-ndk-r27c-linux.zip" \
              'android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/*' \
              -d "$RUNNER_TEMP"
          fi
          echo "NDK=$base" >> "$GITHUB_ENV"
      - name: Compile native ARM64 safe GPU ABI version probe JNI
        shell: bash
        run: |
          set -euo pipefail
          dir=emui11-tas/runtime-inventory
          dest="$dir/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$dest" out
          compiler="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          "$compiler" -std=gnu11 -O2 -Wall -Wextra -Werror -fPIC -shared \
            -Wl,-z,relro,-z,now \
            -o "$dest/libtas_mali_abi.so" \
            "$dir/native/tas_mali_abi.c"
          file "$dest/libtas_mali_abi.so" | tee out/MALI_JNI_FILE.txt
          readelf -h "$dest/libtas_mali_abi.so" > out/MALI_JNI_ELF_HEADER.txt
          readelf -Ws "$dest/libtas_mali_abi.so" > out/MALI_JNI_SYMBOLS.txt
          grep -q AArch64 out/MALI_JNI_ELF_HEADER.txt
          grep -q Java_io_github_tasaudit_runtimeinventory_ProbeCollector_probeMaliNative out/MALI_JNI_SYMBOLS.txt
          sha256sum "$dest/libtas_mali_abi.so" > out/MALI_JNI_SHA256.txt
      - name: Build installable Android 10 diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          (cd emui11-tas/runtime-inventory && gradle --no-daemon --max-workers=2 :app:assembleDebug)
      - name: Check APK is signed and declares no permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=emui11-tas/runtime-inventory/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > out/APK_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" > out/APK_SIGNATURE.txt
          unzip -l "$apk" > out/APK_CONTENTS.txt
          grep -q "package: name='io.github.tasaudit.runtimeinventory'" out/APK_BADGING.txt
          grep -q "sdkVersion:'29'" out/APK_BADGING.txt
          grep -q "targetSdkVersion:'29'" out/APK_BADGING.txt
          ! grep -q '^uses-permission' out/APK_BADGING.txt
          grep -q 'lib/arm64-v8a/libtas_mali_abi.so' out/APK_CONTENTS.txt
          grep -q 'Verified using v2 scheme' out/APK_SIGNATURE.txt
          cp "$apk" out/TAS_AN00_Runtime_Inventory_v1_0-debug.apk
          sha256sum out/TAS_AN00_Runtime_Inventory_v1_0-debug.apk > out/APK_SHA256.txt
          echo "Package performs read-only file fingerprinting and Mali VERSION_CHECK ioctl only." > out/SECURITY_SCOPE.txt
          cat out/APK_SHA256.txt
      - name: Publish APK, SHA256 and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAS-AN00-Runtime-Inventory-v1_0
          path: out/
          retention-days: 7
          if-no-files-found: error
