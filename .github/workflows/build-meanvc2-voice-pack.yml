name: Build MeanVC2 Open Voice Pack 25

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  hailuo_demo:
    if: github.event_name == 'issues' && github.event.issue.title == '[build-meanvc2-voice-pack]'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_URL: https://cdn.hailuoai.com/hailuo-video-web/public_assets/Chinese_crisp_podcaster.mp3
      TARGET_SHA256: 6bd6f2cdb3782e14e19723cb5356f8eb606e05a92297d426a034242d4cb12b9e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Report start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "MeanVC2 long demo started; run: \`${GITHUB_RUN_ID}\`."

      - name: Fetch exact target reference and verify upload hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/final
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            -A 'Mozilla/5.0' -H 'Referer: https://hailuoai.com/' \
            "$TARGET_URL" -o work/target.mp3
          echo "$TARGET_SHA256  work/target.mp3" | sha256sum -c -
          ffprobe -v error -show_entries format=duration,size:stream=sample_rate,channels -of default=nw=1 work/target.mp3 | tee work/target_info.txt
          ffmpeg -hide_banner -loglevel error -y -i work/target.mp3 -ac 1 -ar 16000 work/target.wav

      - name: Build 45 second open-license Mandarin source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'huggingface_hub>=0.25' 'numpy<2.1' scipy soundfile
          python - <<'PY'
          from math import gcd
          import numpy as np, soundfile as sf
          from scipy.signal import resample_poly
          from huggingface_hub import HfApi, hf_hub_download
          repo='AISHELL/AISHELL-3'; spk='SSB0012'; sr_out=16000
          files=HfApi().list_repo_files(repo,repo_type='dataset')
          cand=sorted(p for p in files if p.startswith(f'test/wav/{spk}/') and p.endswith('.wav'))
          pieces=[]; used=[]; dur=0.0; silence=np.zeros(int(.12*sr_out),np.float32)
          for remote in cand:
              local=hf_hub_download(repo,remote,repo_type='dataset')
              y,sr=sf.read(local,always_2d=False)
              if getattr(y,'ndim',1)>1: y=np.mean(y,axis=1)
              y=np.asarray(y,np.float32)
              if not y.size: continue
              peak=float(np.max(np.abs(y)))
              if peak<=1e-7: continue
              idx=np.flatnonzero(np.abs(y)>peak*.02)
              if idx.size:
                  pad=int(.05*sr); y=y[max(0,int(idx[0])-pad):min(len(y),int(idx[-1])+pad)]
              if sr!=sr_out:
                  g=gcd(int(sr),sr_out); y=resample_poly(y,sr_out//g,int(sr)//g).astype(np.float32)
              if len(y)<int(.45*sr_out): continue
              p=float(np.max(np.abs(y))); y=y/(p+1e-8)*.82
              if pieces: pieces.append(silence)
              pieces.append(y); used.append(remote); dur=sum(len(x) for x in pieces)/sr_out
              if dur>=45: break
          if dur<25: raise RuntimeError(f'insufficient source duration {dur}')
          out=np.concatenate(pieces)[:45*sr_out]
          sf.write('work/source.wav',out,sr_out,subtype='PCM_16')
          open('work/source_info.txt','w').write('dataset=AISHELL-3\nlicense=Apache-2.0\nspeaker='+spk+'\nduration='+str(len(out)/sr_out)+'\n'+'\n'.join(used))
          print('source duration',len(out)/sr_out,'files',len(used))
          PY

      - name: Install MeanVC2 runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'torch==2.5.1' 'torchaudio==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -q \
            'numpy<2.1' soundfile 'librosa>=0.10' soxr matplotlib \
            einops ema-pytorch x-transformers torchdiffeq prefigure safetensors \
            's3prl==0.4.18' 'huggingface_hub>=0.25'
          git clone --depth 1 https://github.com/ASLP-lab/MeanVC2.git /tmp/MeanVC2

      - name: Download verified inference checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/MeanVC2/preprocess/ckpts /tmp/MeanVC2/ckpts/pretrained_models /tmp/MeanVC2/ckpts/vocos
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil
          pairs=[
            ('ASLP-lab/MeanVC2','fastu2pp_160ms.pt','/tmp/MeanVC2/preprocess/ckpts/fastu2pp_160ms.pt'),
            ('ASLP-lab/MeanVC2','meanvc2_120ms_40ms.safetensors','/tmp/MeanVC2/ckpts/pretrained_models/meanvc2_120ms_40ms.safetensors'),
            ('ASLP-lab/MeanVC2','vocos.pt','/tmp/MeanVC2/ckpts/vocos/vocos.pt'),
            ('s3prl/converted_ckpts','wavlm_large.pt','/tmp/MeanVC2/preprocess/ckpts/wavlm_large.pt'),
            ('lmzjms/wavlm-large','wavlm_large_finetune.pth','/tmp/MeanVC2/preprocess/ckpts/wavlm_large_finetune.pth'),
          ]
          for repo,name,dst in pairs:
              src=hf_hub_download(repo,name); shutil.copyfile(src,dst); print(name,dst)
          PY
          echo '6fb4b3c3e6aa567f0a997b30855859cb81528ee8078802af439f7b2da0bf100f  /tmp/MeanVC2/preprocess/ckpts/wavlm_large.pt' | sha256sum -c -
          echo '51f07e3b94d9e0262a6a675ef5a087be3dd09e8c62e9d886827f44f82fe7f94b  /tmp/MeanVC2/preprocess/ckpts/wavlm_large_finetune.pth' | sha256sum -c -
          python - <<'PY'
          import torch
          src='/tmp/MeanVC2/preprocess/ckpts/wavlm_large.pt'; dst='/tmp/MeanVC2/preprocess/ckpts/wavlm_large_cfg.pt'
          ckpt=torch.load(src,map_location='cpu',weights_only=False); cfg=ckpt.get('cfg',ckpt.get('config'))
          if cfg is None: raise RuntimeError('wavlm cfg missing')
          torch.save(cfg,dst)
          PY
          rm -f /tmp/MeanVC2/preprocess/ckpts/wavlm_large.pt

      - name: Extract features sequentially and convert
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/MeanVC2
          python - <<'PY'
          import gc, json, os, sys, time
          import numpy as np, torch, soundfile as sf
          sys.path.insert(0,'/tmp/MeanVC2')
          from src.infer.infer_e2e import load_asr_model, extract_bn, vc_inference
          from runtime.src.speaker import init_speaker_model, extract_embedding
          from src.infer.dit_kvcache import DiT
          from src.model.utils import load_checkpoint
          root=os.environ['GITHUB_WORKSPACE']
          source=os.path.join(root,'work','source.wav'); target=os.path.join(root,'work','target.wav')
          asr=load_asr_model('/tmp/MeanVC2/preprocess/ckpts/fastu2pp_160ms.pt','cpu')
          bn=extract_bn(source,asr,window=19,stride=16,offset_init=8,offset_step=4,req_cache=8).astype('float32')
          del asr; gc.collect()
          spk=init_speaker_model('/tmp/MeanVC2/preprocess/ckpts/wavlm_large_finetune.pth',device='cpu',wavlm_config='/tmp/MeanVC2/preprocess/ckpts/wavlm_large_cfg.pt')
          emb=extract_embedding(spk,target,device='cpu').squeeze().detach().cpu().numpy().astype('float32')
          if emb.shape!=(256,): raise RuntimeError(emb.shape)
          np.save(os.path.join(root,'work','final','Chinese_crisp_podcaster_xvector.npy'),emb)
          del spk; gc.collect()
          with open('/tmp/MeanVC2/src/config/config_120ms_40ms.json') as f: cfg=json.load(f)
          model=DiT(**cfg['model'])
          model=load_checkpoint(model,'/tmp/MeanVC2/ckpts/pretrained_models/meanvc2_120ms_40ms.safetensors',device='cpu',use_ema=True).float().eval()
          vocos=torch.jit.load('/tmp/MeanVC2/ckpts/vocos/vocos.pt').eval()
          torch.manual_seed(0)
          t=time.time(); mel,wav=vc_inference(model,vocos,bn,emb,12,4,3,'cpu')
          out=os.path.join(root,'work','final','Chinese_crisp_podcaster_MeanVC2_long_demo_raw.wav')
          sf.write(out,wav.cpu().squeeze().numpy(),16000)
          open(os.path.join(root,'work','final','INFERENCE_INFO.txt'),'w').write(f'bn_shape={bn.shape}\nemb_shape={emb.shape}\nseconds={wav.shape[-1]/16000:.3f}\ninference_seconds={time.time()-t:.3f}\nmodel=120ms_40ms\nsteps=3\n')
          print('done',wav.shape,time.time()-t)
          PY
          cd "$GITHUB_WORKSPACE"
          ffmpeg -hide_banner -loglevel error -y -i work/final/Chinese_crisp_podcaster_MeanVC2_long_demo_raw.wav \
            -af 'highpass=f=55,loudnorm=I=-18:TP=-1.5:LRA=11' -ar 16000 -ac 1 \
            work/final/Chinese_crisp_podcaster_MeanVC2_long_demo.wav
          ffmpeg -hide_banner -loglevel error -y -i work/final/Chinese_crisp_podcaster_MeanVC2_long_demo.wav \
            -c:a libmp3lame -b:a 192k work/final/Chinese_crisp_podcaster_MeanVC2_long_demo.mp3
          rm -f work/final/Chinese_crisp_podcaster_MeanVC2_long_demo_raw.wav
          cp work/source_info.txt work/final/SOURCE_INFO.txt
          cp work/target_info.txt work/final/TARGET_INFO.txt
          sha256sum work/final/* > work/final/SHA256SUMS.txt

      - name: Upload demo
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Chinese-crisp-podcaster-MeanVC2-long-demo
          path: work/final
          compression-level: 6
          retention-days: 1
          if-no-files-found: error

      - name: Report success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "MeanVC2 long demo **PASS**; run: \`${GITHUB_RUN_ID}\`; artifact: **Chinese-crisp-podcaster-MeanVC2-long-demo** (id \`${{ steps.upload.outputs.artifact-id }}\`). Target SHA256 matched the uploaded MP3."

      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "MeanVC2 long demo **FAILED**; run: \`${GITHUB_RUN_ID}\`. Inspect logs."
