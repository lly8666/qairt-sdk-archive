name: Catalyst research database validation
on:
  push:
    branches: [catalyst-wastewater]
    paths: ['catalyst-research/**', '.github/workflows/catalyst-research-validate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/catalyst-wastewater'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: catalyst-research
          persist-credentials: false
      - name: Rebuild and audit
        run: |
          python catalyst-research/check_handoff.py
          python catalyst-research/build.py /tmp/catalyst.sqlite
          python catalyst-research/audit_process_membrane.py /tmp/catalyst.sqlite
          python catalyst-research/market/test_market_identity.py /tmp/catalyst.sqlite
          python catalyst-research/market/test_market_105.py /tmp/catalyst.sqlite
          python catalyst-research/app/test_app.py /tmp/catalyst.sqlite
          python -m py_compile catalyst-research/app/*.py
          python catalyst-research/app/test_workbench.py /tmp/catalyst.sqlite
          python catalyst-research/app/test_action_desk.py /tmp/catalyst.sqlite
          python catalyst-research/app/test_projects.py /tmp/catalyst.sqlite
          python catalyst-research/app/test_product.py /tmp/catalyst.sqlite
          python -c "from pathlib import Path; s=Path('catalyst-research/app/workbench.html').read_text(); Path('/tmp/workbench.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/workbench.js
          python catalyst-research/package_trial.py /tmp/catalyst.sqlite /tmp/catalyst-market-trial.zip
          python catalyst-research/market/audit_market.py /tmp/catalyst.sqlite /tmp/market-audit
          python catalyst-research/test_research_revisit.py /tmp/catalyst.sqlite
          python catalyst-research/test_document_dispatch.py /tmp/catalyst.sqlite
          python catalyst-research/verify_incremental.py /tmp/catalyst.sqlite 19
          python catalyst-research/export_dossiers.py /tmp/catalyst.sqlite /tmp/catalyst-dossiers
          python - <<'PY'
          import sqlite3,pathlib,zipfile
          db=sqlite3.connect('/tmp/catalyst.sqlite')
          for (table,) in db.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"):
              print(table,db.execute('SELECT count(*) FROM "'+table+'"').fetchone()[0])
          print('water coverage',db.execute('SELECT water_level,count(*) FROM sites GROUP BY 1').fetchall())
          print('diagrams by stage',db.execute('SELECT stage,count(*) FROM v_latest_process_diagrams GROUP BY 1').fetchall())
          print('water sites',db.execute('SELECT count(DISTINCT site_id),count(DISTINCT CASE WHEN flow IS NOT NULL THEN site_id END) FROM wastewater').fetchone())
          root=pathlib.Path('/tmp/catalyst-dossiers')
          assert len(list(root.glob('CN*.md')))==db.execute('SELECT count(*) FROM sites').fetchone()[0]
          with zipfile.ZipFile('/tmp/catalyst-dossiers.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.iterdir()): z.write(p,p.name)
          with zipfile.ZipFile('/tmp/catalyst-dossiers.zip') as z:
              assert z.testzip() is None
              print('ZIP entries',len(z.namelist()))
          PY

      - name: Upload rebuilt research database and dossiers
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-research-database-and-dossiers
          path: |
            /tmp/catalyst.sqlite
            /tmp/catalyst-dossiers.zip
            /tmp/market-audit
          retention-days: 7
          if-no-files-found: error

      - name: Upload local market trial
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-market-trial
          path: /tmp/catalyst-market-trial.zip
          retention-days: 7
          if-no-files-found: error
