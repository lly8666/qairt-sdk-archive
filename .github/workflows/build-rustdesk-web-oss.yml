name: Build RustDesk OSS Web Client

on:
  push:
    branches:
      - codex/rustdesk-web-1.4.7
    paths:
      - .github/workflows/build-rustdesk-web-oss.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out RustDesk 1.4.0 with submodules
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.0
          submodules: recursive
          path: rustdesk

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y wget npm protobuf-compiler
          sudo npm install -g yarn typescript vite@2.8

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Apply RustDesk Flutter patch
        shell: bash
        run: |
          set -euxo pipefail
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          cd "$flutter_root"
          git apply "$GITHUB_WORKSPACE/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Prepare the matching RustDesk 1.4.0 web sources
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/rustdesk/flutter/web"
          cp -a v1/. .
          sed -i 's|const SCHEMA = "ws://";|const SCHEMA = "wss://";|' js/src/connection.ts
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text()
          defaults = """  <script>
            if (!localStorage.getItem('custom-rendezvous-server')) {
              localStorage.setItem('custom-rendezvous-server', '1.995588.xyz:23555');
            }
            if (!localStorage.getItem('relay-server')) {
              localStorage.setItem('relay-server', '1.995588.xyz:23556');
            }
            if (!localStorage.getItem('key')) {
              localStorage.setItem('key', 'eY20l6H5TIx4hh4+UMfUTS1Swe8eFqHFtnbXVSc36P8=');
            }
          </script>\n"""
          text = text.replace("</head>", defaults + "</head>", 1)
          path.write_text(text)
          PY

      - name: Compile matching RustDesk JavaScript bridge
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/rustdesk/flutter/web/js"
          yarn install
          yarn add --dev --exact @types/node@16.18.11
          yarn add --exact libsodium@0.7.9 libsodium-wrappers@0.7.9
          yarn build

      - name: Compile matching RustDesk Flutter web UI
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/rustdesk/flutter/web"
          wget -q https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          tar xzf web_deps.tar.gz
          cd "$GITHUB_WORKSPACE/rustdesk/flutter"
          flutter build web --release
          mkdir -p build/web/js
          cp -a web/js/dist build/web/js/

      - name: Package unified static client
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp -a "$GITHUB_WORKSPACE/rustdesk/flutter/build/web" "$GITHUB_WORKSPACE/artifact/web"
          printf '%s\n' \
            'RustDesk OSS Web Client' \
            'RustDesk tag: 1.4.0' \
            'RustDesk commit: e6aefcfa3006623524e0d5a082e9bd80b4189637' \
            'Flutter: 3.24.5' \
            'UI and JavaScript connection bridge compiled from the same source tree.' \
            > "$GITHUB_WORKSPACE/artifact/web/BUILD-INFO.txt"
          tar -C "$GITHUB_WORKSPACE/artifact" -czf \
            "$GITHUB_WORKSPACE/artifact/rustdesk-web-1.4.0-unified.tar.gz" web
          sha256sum "$GITHUB_WORKSPACE/artifact/rustdesk-web-1.4.0-unified.tar.gz"

      - name: Upload unified web client artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-web-1.4.0-unified
          path: |
            artifact/web
            artifact/rustdesk-web-1.4.0-unified.tar.gz
          if-no-files-found: error
          retention-days: 7
