name: Build RustDesk OSS Web Client

on:
  push:
    branches:
      - codex/rustdesk-web-1.4.7
    paths:
      - .github/workflows/build-rustdesk-web-oss.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out reproducible OSS Web builder
        uses: actions/checkout@v4
        with:
          repository: pmietlicki/docker-rustdesk-web-client
          ref: 53b466586ba1de91ae489cd55e33bf99968e97c8
          path: builder

      - name: Compile RustDesk Web client
        shell: bash
        run: |
          set -euxo pipefail
          docker build \
            --file "$GITHUB_WORKSPACE/builder/Dockerfile" \
            --tag rustdesk-web-compiled:20260908 \
            "$GITHUB_WORKSPACE/builder"

      - name: Extract static Web client
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifact/web"
          cid="$(docker create rustdesk-web-compiled:20260908)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/share/nginx/html/." "$GITHUB_WORKSPACE/artifact/web/"
          printf '%s\n' \
            'RustDesk OSS Web Client' \
            'Builder commit: 53b466586ba1de91ae489cd55e33bf99968e97c8' \
            'Built by lly8666/qairt-sdk-archive GitHub Actions' \
            > "$GITHUB_WORKSPACE/artifact/web/BUILD-INFO.txt"
          tar -C "$GITHUB_WORKSPACE/artifact" -czf \
            "$GITHUB_WORKSPACE/artifact/rustdesk-web-oss-20260908.tar.gz" web
          sha256sum "$GITHUB_WORKSPACE/artifact/rustdesk-web-oss-20260908.tar.gz"

      - name: Upload Web client artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-web-oss-20260908
          path: |
            artifact/web
            artifact/rustdesk-web-oss-20260908.tar.gz
          if-no-files-found: error
          retention-days: 7
