name: Build MeanVC2 Xvectors 25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-meanvc2-xvectors-25.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  xvectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download validated 25-reference pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p voice-pack
          gh run download 32562021345 --repo "$GITHUB_REPOSITORY" --name MeanVC2-open-voice-pack-25 --dir voice-pack
          test "$(find voice-pack/references -maxdepth 1 -name '*.wav' | wc -l)" = 25

      - name: Install speaker encoder runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q 'torch==2.5.1' 'torchaudio==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -q 's3prl==0.4.18' 'huggingface_hub>=0.25' 'numpy<2.1' soundfile
          git clone --depth 1 https://github.com/ASLP-lab/MeanVC2.git /tmp/MeanVC2

      - name: Download and verify WavLM checkpoints from HF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/MeanVC2/preprocess/ckpts
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil
          base=hf_hub_download('s3prl/converted_ckpts','wavlm_large.pt')
          fine=hf_hub_download('lmzjms/wavlm-large','wavlm_large_finetune.pth')
          shutil.copyfile(base,'/tmp/MeanVC2/preprocess/ckpts/wavlm_large.pt')
          shutil.copyfile(fine,'/tmp/MeanVC2/preprocess/ckpts/wavlm_large_finetune.pth')
          PY
          echo '6fb4b3c3e6aa567f0a997b30855859cb81528ee8078802af439f7b2da0bf100f  /tmp/MeanVC2/preprocess/ckpts/wavlm_large.pt' | sha256sum -c -
          echo '51f07e3b94d9e0262a6a675ef5a087be3dd09e8c62e9d886827f44f82fe7f94b  /tmp/MeanVC2/preprocess/ckpts/wavlm_large_finetune.pth' | sha256sum -c -

      - name: Extract tiny WavLM config and free base checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          src='/tmp/MeanVC2/preprocess/ckpts/wavlm_large.pt'
          dst='/tmp/MeanVC2/preprocess/ckpts/wavlm_large_cfg.pt'
          ckpt=torch.load(src,map_location='cpu',weights_only=False)
          cfg=ckpt.get('cfg',ckpt.get('config'))
          if cfg is None: raise RuntimeError('cfg/config missing from wavlm_large.pt')
          torch.save(cfg,dst)
          print('cfg saved:',dst)
          PY
          rm -f /tmp/MeanVC2/preprocess/ckpts/wavlm_large.pt

      - name: Extract official MeanVC2 256-d speaker embeddings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voice-pack/xvectors
          cd /tmp/MeanVC2
          python - <<'PY'
          import glob, json, os, sys
          import numpy as np
          sys.path.insert(0,'/tmp/MeanVC2')
          from runtime.src.speaker import init_speaker_model, extract_embedding
          root=os.environ['GITHUB_WORKSPACE']
          model=init_speaker_model(
              ckpt_path='/tmp/MeanVC2/preprocess/ckpts/wavlm_large_finetune.pth',
              device='cpu',
              wavlm_config='/tmp/MeanVC2/preprocess/ckpts/wavlm_large_cfg.pt')
          rows=[]
          for wav in sorted(glob.glob(os.path.join(root,'voice-pack','references','*.wav'))):
              emb=extract_embedding(model,wav,device='cpu').squeeze().detach().cpu().numpy().astype('float32')
              if emb.shape != (256,): raise RuntimeError(f'bad shape {emb.shape} for {wav}')
              name=os.path.basename(wav).replace('.wav','.npy')
              out=os.path.join(root,'voice-pack','xvectors',name)
              np.save(out,emb)
              rows.append({'file':name,'shape':[256],'l2_norm':float(np.linalg.norm(emb))})
              print(rows[-1])
          if len(rows)!=25: raise RuntimeError(f'expected 25, got {len(rows)}')
          with open(os.path.join(root,'voice-pack','xvectors_manifest.json'),'w') as f:
              json.dump(rows,f,indent=2)
          PY
          cd "$GITHUB_WORKSPACE"
          sha256sum voice-pack/xvectors/*.npy > voice-pack/XVECTOR_SHA256SUMS.txt
          echo 'embedding_status=success; official MeanVC2 runtime speaker encoder; raw 256-d float32 embeddings.' > voice-pack/EMBEDDING_STATUS.txt

      - name: Upload completed preset pack
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: MeanVC2-open-voice-pack-25-with-xvectors
          path: voice-pack
          compression-level: 6
          retention-days: 14
          if-no-files-found: error

      - name: Report completed pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 118 --repo "$GITHUB_REPOSITORY" --body "Xvector build PASS. Artifact: **MeanVC2-open-voice-pack-25-with-xvectors** (artifact id \`${{ steps.upload.outputs.artifact-id }}\`), containing 25 reference WAVs + 25 raw 256-d MeanVC2 speaker embeddings."
