name: Build MeanVc2 Rev46 HTP Batch Lab APK

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[build-meanvc2-rev46-htp-lab-apk]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Start timing
        shell: bash
        run: date +%s > /tmp/rev46_action_start

      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android 35 build platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Generate public focused ONNX matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'numpy==2.2.6' 'onnx==1.19.1'
          out='android-labs/MeanVc2Rev46HtpLab/app/src/main/assets/models'
          mkdir -p "$out"
          python3 host-tools/rev46_android_lab/generate_rev46_activation_models.py --out "$out"
          find "$out" -type f -name '*.onnx' -print0 | sort -z | xargs -0 sha256sum | tee /tmp/MODEL_SHA256SUMS.txt
          test "$(find "$out" -type f -name '*.onnx' | wc -l)" = 10

      - name: Restore stable public lab signer
        shell: bash
        run: |
          set -euo pipefail
          cd android-labs/MeanVc2Rev46HtpLab
          base64 -d ci/rev46-public-lab.p12.b64 > ci/rev46-public-lab.p12
          keytool -list -keystore ci/rev46-public-lab.p12 -storetype PKCS12 -storepass meanvc2lab -alias meanvc2lab >/dev/null

      - name: Assemble debug APK
        id: gradle_build
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cd android-labs/MeanVc2Rev46HtpLab
          gradle --no-daemon --max-workers=2 :app:assembleDebug
          end="$(date +%s)"
          echo "seconds=$((end-start))" >> "$GITHUB_OUTPUT"

      - name: Verify APK and freeze provenance
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          root='android-labs/MeanVc2Rev46HtpLab'
          apk="$root/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          unzip -l "$apk" > /tmp/apk-files.txt
          grep -q 'assets/models/canonical_gelu_t4.onnx' /tmp/apk-files.txt
          grep -q 'assets/models/ch60d16_pairwise_t6.onnx' /tmp/apk-files.txt
          grep -q 'lib/arm64-v8a/libonnxruntime.so' /tmp/apk-files.txt
          grep -q 'QnnHtp' /tmp/apk-files.txt
          sha="$(sha256sum "$apk" | awk '{print $1}')"; bytes="$(stat -c %s "$apk")"
          total="$(( $(date +%s) - $(cat /tmp/rev46_action_start) ))"
          cp /tmp/MODEL_SHA256SUMS.txt "$root/MODEL_SHA256SUMS.txt"
          cat > "$root/BUILD_PROVENANCE.txt" <<EOF
          schema=1
          workflow=Build MeanVc2 Rev46 HTP Batch Lab APK
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_commit=${GITHUB_SHA}
          application_id=com.simadmin.meanvc2rev46lab
          version_name=0.1-rev46-htp-lowering-batch
          ort_android_qnn=1.27.0
          qnn_runtime=2.44.0
          qnn_cpu_fallback_disabled_by_app=true
          model_variants=canonical_gelu,split_exact_gelu,ch60d16_pairwise,erf_only,identity
          frame_shapes=4,6
          input_patterns=cold_stats,warm1_stats,warm18_stats,warm47_stats,sweep,zero_dense
          device_configs=prod_fp16_opt3,fp32ctl_opt3,opt0ctl_fp16
          prod_fresh_session_repeat=true
          apk_bytes=${bytes}
          apk_sha256=${sha}
          gradle_seconds=${{ steps.gradle_build.outputs.seconds }}
          measured_action_seconds=${total}
          communication_source_included=false
          production_integration=false
          EOF
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: MeanVc2Rev46HtpLab-batch-debug
          path: |
            android-labs/MeanVc2Rev46HtpLab/app/build/outputs/apk/debug/app-debug.apk
            android-labs/MeanVc2Rev46HtpLab/BUILD_PROVENANCE.txt
            android-labs/MeanVc2Rev46HtpLab/MODEL_SHA256SUMS.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Report build result
        if: success() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "APK build PASS. Workflow: **Build MeanVc2 Rev46 HTP Batch Lab APK**; run: \`${GITHUB_RUN_ID}\`; artifact: **MeanVc2Rev46HtpLab-batch-debug** (artifact id \`${{ steps.upload.outputs.artifact-id }}\`); APK bytes: \`${{ steps.verify.outputs.bytes }}\`; APK SHA256: \`${{ steps.verify.outputs.sha }}\`; Gradle assemble: \`${{ steps.gradle_build.outputs.seconds }}s\`; measured action work: \`${{ steps.verify.outputs.total }}s\`. Install the debug APK manually, tap ‘运行全部 Rev46 批量诊断’, then ‘复制完整 UTF-8 日志’."

      - name: Report build failure
        if: failure() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "APK build FAILED. Workflow: **Build MeanVc2 Rev46 HTP Batch Lab APK**; run: \`${GITHUB_RUN_ID}\`. Inspect the failing step; no APK should be treated as qualified."
