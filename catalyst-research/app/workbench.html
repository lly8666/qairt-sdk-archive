<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工业废水 · 技术商务工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#17333b;background:#f3f6f6}header{background:#143e46;color:white;padding:16px 20px}header h1{font-size:21px;margin:0 0 7px}header small{color:#d2e9e6}nav{display:flex;gap:8px;flex-wrap:wrap;background:#fff;padding:10px 16px;border-bottom:1px solid #d9e3e3;position:sticky;top:0;z-index:2}main{max-width:1280px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;border:1px solid #b6c9ca;border-radius:7px;padding:9px;background:white;color:#17333b}button{cursor:pointer}button.active,button.primary{background:#236d61;color:white;border-color:#236d61}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.tile,.panel,.item{background:#fff;border:1px solid #d7e2e2;border-radius:9px;padding:13px;margin:5px 0}.tile strong{font-size:25px;display:block}.split{display:grid;grid-template-columns:minmax(255px,1fr) minmax(0,2fr);gap:14px}.item{text-align:left;width:100%;display:block}.item:hover{background:#eaf5f0}small,.muted{color:#587075}header small{color:#d2e9e6}.tag{font-size:12px;background:#e6eeed;border-radius:5px;padding:3px 6px;display:inline-block;margin:2px}h2{font-size:19px}h3{font-size:16px;margin:12px 0 6px}label{display:block;margin:8px 0}textarea{width:100%;min-height:72px}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #dae3e3;vertical-align:top;font-size:13px;overflow-wrap:anywhere}.scroll{overflow:auto}a{color:#126a73}@media(max-width:760px){.split{display:block}.filters>*{max-width:100%}main{padding:10px}nav{position:static}}
</style><header><h1>工业废水 · 技术商务工作台</h1><small id="mode">本地试用 · 公开事实与内部工作区分离</small></header><nav id="nav"></nav><main id="main"></main>
<script>
const $=x=>document.getElementById(x), main=$('main');
const dirs={high_salt:'高盐浓缩',ammonia:'氨氮处理',metal_recovery:'金属回收',organic:'高有机废水',evaporation:'减蒸发负荷',reuse:'废水回用',external_disposal:'废液减量',membrane_optimization:'膜系统优化',resource_recovery:'资源回收',capacity_retrofit:'扩容改造',new_build_retrofit:'新建技改',procurement_followup:'采购跟踪'};
const owners={private_controlled:'民营控制',central_state_controlled:'央企控制',local_state_controlled:'地方国资',foreign_controlled:'外资控制',mixed_control_unclear:'混合待核',other:'其他',unknown:'待核'};
const queues={seed_review:'历史重点线索',signal_and_channel:'有线索及公开渠道',signal_review:'线索待核',scope_review:'主体范围待核',water_evidence_gap:'水需求待核'};
const stages=['未联系','待确认','技术初筛','取样/小试','方案报价','项目推进','已成交','暂缓','关闭'];
let stats,role='business',current=null,token=0;
function el(t,v,p,cls){let e=document.createElement(t);if(v!=null)e.textContent=v;if(cls)e.className=cls;if(p)p.append(e);return e}
function btn(p,v,fn,cls){let b=el('button',v,p,cls);b.onclick=fn;return b}
function input(p,ph,val='',type='text'){let i=el('input',null,p);i.type=type;i.placeholder=ph;i.value=val;return i}
function select(p,entries){let s=el('select',null,p);for(const [v,n] of entries){let o=el('option',n,s);o.value=v}return s}
function label(p,v){return el('label',v,p)}
function note(p,v){return el('p',v,p,'muted')}
function chips(p,x){for(const d of x)el('span',dirs[d.direction]||d.direction,p,'tag')}
function record(p,r,keys){let a=el('div',null,p,'panel');for(let k of keys||Object.keys(r)){if(r[k]==null||r[k]==='')continue;let l=el('div',null,a);el('strong',k+'：',l);if(k==='url'||k.endsWith('_url')){try{let u=new URL(r[k]);if(['http:','https:'].includes(u.protocol)){let b=el('a',r[k],l);b.href=u.href;b.target='_blank';b.rel='noopener';continue}}catch(e){}}el('span',String(r[k]),l)}}
async function get(path,x={}){let r=await fetch(path+'?'+new URLSearchParams(x));let d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
async function post(path,x){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});let d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function nav(){let n=$('nav');n.replaceChildren();for(const [k,t] of [['business','业务工作台'],['tech','技术工作台'],['capability','技术能力'],['followup','跟进记录'],['market','市场概览']])btn(n,t,()=>open(k),role===k?'active':'')}
function dashboard(p){let g=el('div',null,p,'grid');for(let [n,v] of [['研究主体',stats.subjects],['有废水资料',stats.water_sites],['有潜在线索主体',stats.signal_sites],['筛查方向',stats.signals],['法人控制权证据',stats.ownership_sites]]){let a=el('div',null,g,'tile');el('small',n,a);el('strong',v,a)}note(p,'市场线索不是已确认需求，方向数量不是项目数；所有制显示对应披露时期。')}
async function open(k){role=k;token++;nav();main.replaceChildren();try{if(k==='business'||k==='tech')return browser();if(k==='market'){dashboard(main);for(let x of stats.directions)el('p',(dirs[x.direction]||x.direction)+' · '+x.n+' 个主体方向',main);for(let x of stats.queues)el('p',(queues[x.research_queue]||x.research_queue)+' · '+x.n+' 个主体',main);return}if(!stats.workspace)return note(main,'启动时添加 --workspace /仓库外/工作区.sqlite 以启用本地录入。');if(k==='capability')return capPage();if(k==='followup'){let a=await get('/work/followups');for(let r of a)record(main,r);if(!a.length)note(main,'暂无跟进记录。请从客户详情录入。')}}catch(e){note(main,e.message)}}
function browser(){dashboard(main);let f=el('div',null,main,'row filters');let q=input(f,'搜索企业/产品/城市'),p=select(f,[['','全部地区'],...stats.provinces.map(x=>[x.province,x.province])]),d=select(f,[['','全部技术方向'],...Object.entries(dirs)]),o=select(f,[['','全部所有制'],...Object.entries(owners)]),qu=select(f,[['','全部队列'],...Object.entries(queues)]),pr=select(f,[['1','民企优先（有证据）'],['0','不区分所有制']]),ch=select(f,[['1','有渠道优先'],['0','不区分渠道']]);let page=0,total=0;let split=el('div',null,main,'split'),list=el('section',null,split,'panel'),right=el('section','选择客户，查看对应工作台详情。',split,'panel');let count=el('p',null,list),results=el('div',null,list),paging=el('div',null,list,'row');let prev=btn(paging,'上一页',()=>{page--;search()}),next=btn(paging,'下一页',()=>{page++;search()});
async function search(){try{let z=await get('/work/sites',{q:q.value,province:p.value,direction:d.value,owner:o.value,queue:qu.value,private:pr.value,channels:ch.value,limit:25,offset:25*page});total=z.total;count.textContent='共 '+total+' 个主体';results.replaceChildren();for(let r of z.items){let b=btn(results,r.name,()=>show(r.site_id,right),'item');el('div',[r.province,r.city,r.record_type].filter(Boolean).join(' · '),b,'muted');chips(b,r.directions);el('small',(queues[r.research_queue]||r.research_queue)+' | 废水 '+r.water_count+' | 渠道 '+r.contact_count,b);for(let x of r.ownership)el('div',(owners[x.ownership_class]||x.ownership_class)+' · '+x.effective_period+(x.link_role==='group_scope'?'（集团）':''),b,'muted')}prev.disabled=page===0;next.disabled=(page+1)*25>=total}catch(e){count.textContent=e.message}}btn(f,'查询',()=>{page=0;search()},'primary');q.onkeydown=e=>{if(e.key==='Enter'){page=0;search()}};for(let a of [p,d,o,qu,pr,ch])a.onchange=()=>{page=0;search()};search()}
function showRows(p,arr,keys){if(!arr.length)note(p,'未取得资料或未映射。');for(let r of arr)record(p,r,keys)}
async function show(id,right){let n=++token;right.textContent='加载…';try{let x=await get('/work/detail',{id});if(n!==token)return;current=x;right.replaceChildren();el('h2',x.site.name,right);note(right,x.site.record_type+' · '+x.site.status+' · '+x.site.mapping_state);chips(right,x.directions);let tabs=el('div',null,right,'row'),panel=el('div',null,right);function tab(v,fn){btn(tabs,v,()=>{panel.replaceChildren();fn()})}function summary(){record(panel,x.site,['province','city','address','category','capacity_summary','water_summary']);el('h3','切入方向（初筛）',panel);for(let a of x.directions){let b=el('div',null,panel,'panel');el('strong',dirs[a.direction]||a.direction,b);note(b,a.evidence_signal||'公开记录关键词提示，需技术复核');note(b,a.qualification_gap||'核实际分股水量、水质、现有设施及浓水去向');if(stats.workspace)btn(b,'跟进此方向',()=>{panel.replaceChildren();form(panel,x,a.candidate_id)})}el('h3','所有制/采购',panel);showRows(panel,x.ownership,['ownership_class','listed_status','effective_period','link_role','boundary','source_id']);showRows(panel,x.procurement,['buyer_label','package_scope','procurement_stage','boundary','outreach_hypothesis','source_url']);el('h3','公开工作渠道',panel);showRows(panel,x.channels,['organization','contact_scope','department','channel_type','public_work_channel','use_boundary','source_id'])}
function tech(){el('h3','废水记录（原口径）',panel);showRows(panel,x.water,['water_id','stream','stage','flow','flow_unit','flow_basis','scope_class','pollutants','process','destination','residuals','source_id']);el('h3','膜设备及适用边界',panel);showRows(panel,x.equipment,['unit_label','technology','role','stage','period','application_boundary','specification','source_id']);el('h3','污水站及连接',panel);showRows(panel,x.systems);showRows(panel,x.connections);el('h3','经济参考（非当前成本）',panel);showRows(panel,x.costs)}
tab('业务概况',summary);tab('技术资料',tech);tab('水质',async()=>{let m=await get('/api/metrics',{id,limit:100,offset:0});if(n!==token)return;note(panel,'共 '+m.total+' 条，当前最多显示100条；阶段/测点见记录。');showRows(panel,m.items,['point','metric','value_num','value_text','unit','result_kind','period','source_id'])});tab('生产/项目',()=>{showRows(panel,x.production);showRows(panel,x.projects)});tab('集团及关联',()=>{showRows(panel,x.entities);showRows(panel,x.legacy_relations);showRows(panel,x.relations)});tab('工艺与膜审查',()=>{showRows(panel,x.diagrams);showRows(panel,x.membrane_reviews);showRows(panel,x.retrofits)});tab('证据',()=>showRows(panel,x.sources,['source_id','title','url','document_date','scope']));tab('跟进',()=>{if(stats.workspace)form(panel,x);else note(panel,'工作区未启用。');showRows(panel,x.followups||[])});if(role==='tech')tech();else summary()}catch(e){right.textContent=e.message}}
function form(p,x,candidate=''){el('h3','新增跟进',p);let sel=select(label(p,'商机方向'),[['','整个客户'],...x.directions.map(a=>[a.candidate_id,dirs[a.direction]||a.direction])]);sel.value=candidate;let stage=select(label(p,'阶段'),stages.map(a=>[a,a])),owner=input(label(p,'负责人'),'姓名'),action=input(label(p,'下一步'),'例如：联系技术部门获取进水数据'),date=input(label(p,'下次日期'),'','','date'),notes=el('textarea',null,label(p,'沟通备注'));let msg=el('p','',p);btn(p,'保存跟进',async()=>{try{await post('/work/followups',{site_id:x.site.site_id,candidate_id:sel.value,stage:stage.value,owner:owner.value,next_action:action.value,next_date:date.value,notes:notes.value});msg.textContent='已保存；跟进页可查看。';notes.value=''}catch(e){msg.textContent=e.message}},'primary')}
async function capPage(){el('h2','技术能力与版本',main);note(main,'每次保存为新版本。方向匹配仅为初筛；真实参数需技术员确认。');let f=el('div',null,main,'panel'),name=input(label(f,'技术名称'),'例如：高盐浓缩'),direction=select(label(f,'主要技术方向'),Object.entries(dirs)),parameter=input(label(f,'可选参数'),'例如 TDS'),unit=input(label(f,'单位'),'例如 g/L'),min=input(label(f,'最小值（可选）'),'','','number'),max=input(label(f,'最大值（可选）'),'','','number'),notes=el('textarea',null,label(f,'适用边界、前处理、出水和浓水条件'));let msg=el('p','',f);btn(f,'保存新版本',async()=>{try{let constraints=parameter.value?[{parameter:parameter.value,unit:unit.value,scope:'feed',min:min.value===''?null:Number(min.value),max:max.value===''?null:Number(max.value),hard:true}]:[];await post('/work/capabilities',{module:name.value,directions:[direction.value],constraints,notes:notes.value});open('capability')}catch(e){msg.textContent=e.message}},'primary');let versions=await get('/work/capabilities');for(let v of versions){let r=el('div',null,main,'panel');el('strong',v.module+' · V'+v.version,r);note(r,v.directions.map(d=>dirs[d]).join('、')+' · '+v.notes);btn(r,'查看全市场方向匹配',async()=>{let a=await get('/work/matches',{version:v.id});r.querySelector('.match')?.remove();let box=el('div',null,r,'match');note(box,a.length+' 个方向候选，参数未知；不是已确认技术适配。');for(let m of a)el('div',m.name+' · '+(dirs[m.direction]||m.direction),box)});let old=versions.find(a=>a.module===v.module&&a.version===v.version-1);if(old)btn(r,'与上版比较',async()=>{let a=await get('/work/compare',{old:old.id,new:v.id});note(r,'方向候选 '+a.before+' → '+a.after+'，新增 '+a.added.length+'，移除 '+a.removed.length)})}}
(async()=>{try{stats=await get('/work/overview');$('mode').textContent=stats.workspace?'本地单用户试用 · 内部数据单独保存':'公开市场只读 · 未启用内部工作区';open('business')}catch(e){main.textContent=e.message}})();
</script></html>
