<header><h1>工业废水 · 技术商务工作台</h1><small id="mode">公开市场事实 + 本地工作区</small></header><nav id="nav"></nav><main id="main"></main>
<script>

function node(tag,text,parent,cls){const x=document.createElement(tag);if(text!==undefined&&text!==null)x.textContent=text;if(cls)x.className=cls;if(parent)parent.append(x);return x}
function button(parent,text,fn,cls){const b=node('button',text,parent,cls);b.onclick=fn;return b}
function field(parent,title,placeholder,value,type){const l=node('label',title,parent);const i=node('input',null,l);i.placeholder=placeholder||'';i.value=value||'';i.type=type||'text';return i}
function select(parent,title,options){const l=node('label',title,parent),s=node('select',null,l);for(const x of options){const o=node('option',x[1],s);o.value=x[0]}return s}
function textArea(parent,title,placeholder){const l=node('label',title,parent),t=node('textarea',null,l);t.placeholder=placeholder||'';return t}
function note(parent,text){return node('p',text,parent,'muted')}
function tag(parent,text){return node('span',text,parent,'tag')}
function linkValue(parent,key,value){const l=node('div',null,parent);node('strong',key+'：',l);if(/^https?:\/\//i.test(value)){const a=node('a',value,l);a.href=value;a.target='_blank';a.rel='noopener'}else if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)){const a=node('a',value,l);a.href='mailto:'+value}else if(/^\+?[0-9() -]{7,}$/.test(value)){const a=node('a',value,l);a.href='tel:'+value}else node('span',value,l)}
function record(parent,r,keys){const box=node('div',null,parent,'panel');for(const k of (keys||Object.keys(r))){const v=r[k];if(v===null||v===undefined||v==='')continue;if(k==='public_work_channel'||k==='source_url'||k==='url'){linkValue(box,k,v)}else{const l=node('div',null,box);node('strong',k+'：',l);node('span',String(v),l)}}return box}
async function get(path,params){const r=await fetch(path+'?'+new URLSearchParams(params||{}));const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function nav(){const n=$('nav');n.replaceChildren();const groups=[['home','首页',['home']],['business','客户',['business','tech']],['action','商机',['action','projects','tasks','cards']],['capability','技术',['capability','cases','economics','scenarios']],['management','管理',['management','market']]];for(const [k,t,a] of groups)button(n,t,()=>open(k),a.includes(role)?'active':'')}
function dashboard(parent){const g=node('div',null,parent,'grid');for(const [name,val] of [['研究主体',stats.subjects],['废水原始记录',stats.water_records],['命中独立流股',stats.signal_streams],['主体×方向候选',stats.signals],['有线索主体',stats.signal_sites],['有控制权证据主体',stats.ownership_sites]]){const x=node('div',null,g,'tile');node('small',name,x);node('strong',Number(val||0).toLocaleString(),x)}note(parent,'独立流股数、方向命中数、主体×方向数分别统计；关键词线索不是已确认需求。')}
async function open(page){role=page;serial++;nav();main.replaceChildren();try{if(page==='home')return homePage();if(page==='cards')return cardsPage();if(page==='cases')return casePage();if(page==='business'||page==='tech')return browsePage();if(page==='market')return marketPage();if(page==='action')return actionPage();if(page==='projects')return projectsPage();if(page==='capability')return capabilityPage();if(page==='tasks')return tasksPage();if(page==='economics')return economicsPage();if(page==='scenarios')return scenarioPage();if(page==='management')return managementPage()}catch(e){note(main,e.message)}}
function browsePage(){const bar=node('div',null,main,'row');button(bar,'业务客户',()=>open('business'),role==='business'?'active':'');button(bar,'技术客户',()=>open('tech'),role==='tech'?'active':'');const f=node('div',null,main,'row filters'),q=field(f,'搜索企业/产品/城市','输入关键词',homeQuery),p=select(f,'地区',[['','全部'],...stats.provinces.map(x=>[x.province,x.province])]),d=select(f,'废水/技术方向',[['','全部'],...Object.entries(dirs)]),o=select(f,'所有制',[['','全部'],...Object.entries(owners)]),qu=select(f,'开发队列',[['','全部'],...Object.entries(queues)]),pr=select(f,'排序',[['1','民企证据优先'],['0','不区分所有制']]),ch=select(f,'公开渠道',[['1','有渠道优先'],['0','不区分']]);const split=node('div',null,main,'split'),left=node('section',null,split,'panel'),right=node('section','选择一家企业查看档案。',split,'panel'),count=node('p','',left),items=node('div',null,left),pages=node('div',null,left,'row');let page=0,total=0;
async function search(){const z=await get('/work/sites',{q:q.value,province:p.value,direction:d.value,owner:o.value,queue:qu.value,private:pr.value,channels:ch.value,limit:25,offset:page*25});total=z.total;count.textContent='共 '+total+' 条主体记录';items.replaceChildren();for(const r of z.items){const b=button(items,r.name,()=>show(r.site_id,right),'item');node('div',[r.province,r.city,r.record_type].filter(Boolean).join(' · '),b,'muted');for(const x of r.directions)tag(b,(dirs[x.direction]||x.direction)+' '+x.water_records);node('small',(queues[r.research_queue]||r.research_queue)+' · 废水 '+r.water_count+' · 公开渠道 '+r.usable_channels,b);for(const x of r.ownership)node('div',(owners[x.ownership_class]||x.ownership_class)+' · '+x.effective_period+(x.link_role==='group_scope'?'（集团）':''),b,'subtle')}prev.disabled=page===0;next.disabled=(page+1)*25>=total}
const prev=button(pages,'上一页',()=>{page--;search()}),next=button(pages,'下一页',()=>{page++;search()});button(f,'筛选',()=>{page=0;search()},'primary');q.onkeydown=e=>{if(e.key==='Enter'){page=0;search()}};for(const x of [p,d,o,qu,pr,ch])x.onchange=()=>{page=0;search()};search()}
function showRows(parent,arr,keys){if(!arr||!arr.length){note(parent,'暂无公开记录或尚未映射。');return}for(const r of arr)record(parent,r,keys)}
async function show(siteId,right){const n=++serial;right.textContent='读取客户资料…';try{const x=await get('/work/detail',{id:siteId});if(n!==serial)return;selected=x;right.replaceChildren();node('h2',x.site.name,right);note(right,[x.site.province,x.site.city,x.site.record_type,x.site.status].filter(Boolean).join(' · '));for(const a of x.directions)tag(right,(dirs[a.direction]||a.direction)+' · '+a.water_records+'流股');const tabs=node('div',null,right,'row'),panel=node('div',null,right);function tab(name,fn){button(tabs,name,()=>{panel.replaceChildren();fn()})}
function overview(){record(panel,x.site,['province','city','address','category','capacity_summary','water_summary']);node('h3','可调查方向',panel);for(const a of x.directions){const c=node('div',null,panel,'panel');node('strong',dirs[a.direction]||a.direction,c);note(c,'直接命中流股 '+a.direct_water_records+'；上下文命中 '+a.contextual_water_records);note(c,a.evidence_signal||'关键词筛查，需查看原始流股与来源');note(c,a.qualification_gap||'核实实际流量、水质、现有设施和采购计划');if(stats.workspace)button(c,'记录下一步',()=>{panel.replaceChildren();followupForm(panel,x,a.candidate_id)})}node('h3','所有制及采购',panel);showRows(panel,x.ownership,['ownership_class','listed_status','effective_period','link_role','boundary','source_id']);showRows(panel,x.procurement,['buyer_label','package_scope','procurement_stage','evidence_period','boundary','outreach_hypothesis','source_url']);node('h3','公开工作渠道',panel);showRows(panel,x.channels,['organization','contact_scope','department','channel_type','public_work_channel','use_boundary','source_id'])}
function water(){node('h3','废水原始流股',panel);note(panel,'同一流股可能在多个方向出现；设计量、实际量和全厂量分开查看。');for(const w of x.water){const c=node('div',null,panel,'stream');node('strong',w.stream||w.water_id,c);tag(c,w.water_id);node('div',[w.stage,w.flow!==null?w.flow+' '+(w.flow_unit||''):null,w.flow_basis].filter(Boolean).join(' · '),c,'subtle');note(c,'水质：'+(w.pollutants||'未披露'));note(c,'工艺：'+(w.process||'未披露'));note(c,'去向：'+(w.destination||'未披露'));note(c,'残余物：'+(w.residuals||'未披露'));button(c,'同记录水质及费用',async()=>{const a=await get('/work/stream',{site_id:x.site.site_id,water_id:w.water_id});const b=node('div',null,c,'panel');note(b,'同一记录关联，不保证同采样期。');showRows(b,a.metrics,['point','metric','value_num','value_text','unit','result_kind','period','source_id']);showRows(b,a.costs)});if(stats.workspace){button(c,'录入该流股参数',()=>observationForm(c,x.site.site_id,w));button(c,'查看已录参数',async()=>{const a=await get('/work/observations',{site_id:x.site.site_id,water_id:w.water_id});for(const r of a)record(c,r,['parameter','value','unit','scope','basis','observed_on','notes'])})}}node('h3','现有工艺设备',panel);showRows(panel,x.systems);showRows(panel,x.connections)}
function membranes(){node('h3','膜设备及适用边界',panel);showRows(panel,x.equipment,['unit_label','technology','technology_family','role','feed','permeate_destination','concentrate_destination','stage','period','application_boundary','specification','source_id']);node('h3','膜技术审查',panel);showRows(panel,x.membrane_reviews,['scope_key','stage','period','presence','evidence_basis','gaps','source_id']);showRows(panel,x.retrofits)}
tab('客户概况',()=>{overview();briefView(panel,siteId)});tab('工程分析',()=>{diagramView(panel,siteId);water();membranes()});tab('水质测点',async()=>{const m=await get('/api/metrics',{id:siteId,limit:100,offset:0});if(n!==serial)return;note(panel,'水质指标 '+m.total+' 条，最多显示100条。');showRows(panel,m.items,['point','metric','value_num','value_text','unit','result_kind','period','source_id'])});tab('采购与联系',()=>{showRows(panel,x.procurement);showRows(panel,x.channels,['organization','contact_scope','department','channel_type','public_work_channel','use_boundary','source_id'])});tab('生产与集团',()=>{showRows(panel,x.production);showRows(panel,x.projects);showRows(panel,x.entities);showRows(panel,x.legacy_relations);showRows(panel,x.relations)});tab('证据',()=>showRows(panel,x.sources,['source_id','title','url','document_date','scope']));tab('客户项目',()=>customerProjects(panel,x));tab('跟进',()=>{if(stats.workspace)followupForm(panel,x);showRows(panel,x.followups||[])});
if(role==='tech'){diagramView(panel,siteId);water();membranes()}else{overview();briefView(panel,siteId)}}catch(e){right.textContent=e.message}}
function followupForm(parent,x,candidate){if(!stats.workspace){note(parent,'启动时添加 --workspace 路径启用本地跟进。');return}node('h3','新增下一步行动',parent);const f=node('div',null,parent,'panel'),stage=select(f,'阶段',stages.map(x=>[x,x]));const owner=field(f,'负责人','姓名'),action=field(f,'下一步行动','例如：联系环保负责人确认水量'),date=field(f,'计划日期','','','date'),notes=textArea(f,'备注','');const msg=node('p','',f);button(f,'保存',async()=>{try{await post('/work/followups',{site_id:x.site.site_id,candidate_id:candidate||null,stage:stage.value,owner:owner.value,next_action:action.value,next_date:date.value,notes:notes.value});msg.textContent='已保存到本地工作区。'}catch(e){msg.textContent=e.message}},'primary')}
function observationForm(parent,siteId,w){const f=node('div',null,parent,'panel');node('strong','录入 '+w.water_id+' 参数',f);const grid=node('div',null,f,'formgrid'),parameter=field(grid,'指标','TDS / COD / 氨氮 / pH'),value=field(grid,'数值','数值','','number'),unit=field(grid,'单位','mg/L / g/L'),scope=select(grid,'采样位置',[['feed','进水'],['permeate','产水'],['concentrate','浓水'],['process','工艺段'],['other','其他']]),basis=select(grid,'数据依据',[['actual_verified','实际实测'],['customer_disclosed','客户提供'],['synthetic','合成测试']]),date=field(grid,'日期','','','date'),notes=textArea(f,'说明','采样点、检测方法或备注');button(f,'保存参数',async()=>{try{if(!value.value.trim())throw Error('填写参数数值');const r=await post('/work/observations',{site_id:siteId,water_id:w.water_id,parameter:parameter.value,value:Number(value.value),unit:unit.value,scope:scope.value,basis:basis.value,observed_on:date.value,notes:notes.value});note(f,'已保存，记录编号 '+r.id)}catch(e){note(f,e.message)}},'primary')}
function addConstraint(parent){const row=node('div',null,parent,'row panel');const p=field(row,'参数','TDS / COD / pH'),u=field(row,'单位','mg/L'),s=select(row,'范围',[['feed','进水'],['permeate','产水'],['concentrate','浓水'],['process','工艺段']]),lo=field(row,'最小值（可空）','', '', 'number'),hi=field(row,'最大值（可空）','', '', 'number');button(row,'删除',()=>row.remove());return ()=>({parameter:p.value,unit:u.value,scope:s.value,min:lo.value===''?null:Number(lo.value),max:hi.value===''?null:Number(hi.value),hard:true})}
async function capabilityPage(){const bar=node('div',null,main,'row');button(bar,'技术能力',()=>open('capability'),'active');button(bar,'工程案例',()=>open('cases'));button(bar,'经济测算',()=>open('economics'));button(bar,'三情景',()=>open('scenarios'));if(!stats.workspace)return note(main,'启动时添加 --workspace 路径启用技术能力版本保存。');node('h2','公司技术能力库',main);note(main,'每次保存形成新版本。只有录入实际流股参数后才做数值筛查；未知不算通过。');const f=node('div',null,main,'panel'),name=field(f,'技术模块名称','例如：高盐膜浓缩'),direction=select(f,'适用方向（可多选）',Object.entries(dirs)),notes=textArea(f,'适用边界、前处理、产水及浓水去向','说明适用水质、规模、限制和成熟度'),constraints=node('div',null,f),collect=[];direction.multiple=true;direction.size=5;addConstraint(constraints);button(f,'添加参数边界',()=>collect.push(addConstraint(constraints)));button(f,'追加方向参数模板（不填阈值）',async()=>{for(const t of await get('/work/templates',{direction:direction.value})){addConstraint(constraints);const a=constraints.lastElementChild.querySelectorAll('input,select');a[0].value=t.parameter;a[1].value=t.unit;a[2].value=t.scope}});const msg=node('p','',f);button(f,'保存技术新版本',async()=>{try{const rules=Array.from(constraints.children).map(x=>{const a=x.querySelectorAll('input,select');return {parameter:a[0].value,unit:a[1].value,scope:a[2].value,min:a[3].value===''?null:Number(a[3].value),max:a[4].value===''?null:Number(a[4].value),hard:true}}).filter(x=>x.parameter&&x.unit&&(x.min!==null||x.max!==null));await post('/work/capabilities',{module:name.value,directions:Array.from(direction.selectedOptions).map(o=>o.value),constraints:rules,notes:notes.value});main.replaceChildren();capabilityPage()}catch(e){msg.textContent=e.message}},'primary');const versions=await get('/work/capabilities');node('h3','已保存版本',main);for(const v of versions){const c=node('div',null,main,'panel');node('strong',v.module+' · V'+v.version,c);note(c,v.directions.map(x=>dirs[x]||x).join('、')+' · '+v.notes);button(c,'扫描市场流股',async()=>{const m=await get('/work/matches',{version:v.id});const box=node('div',null,c,'panel');const count={} function drawGraph(p,g){const rows={};for(const n of g.nodes)(rows[n.rank]??=[]).push(n);const ranks=Object.keys(rows).map(Number),width=Math.max(280,...Object.values(rows).map(r=>r.length*240)),height=(Math.max(0,...ranks)+1)*125+24,pos={};for(const r of ranks){const a=rows[r];a.forEach((n,i)=>{pos[n.id]={x:(width-a.length*240)/2+i*240+15,y:r*125+14,n}})}const wrap=node('div',null,p,'scroll'),s=svgEl('svg',{viewBox:'0 0 '+width+' '+height,width:width,height:height,role:'img','aria-label':'证据工艺流程图'},wrap);const defs=svgEl('defs',{},s),mid='arrow'+Math.random().toString(36).slice(2);const m=svgEl('marker',{id:mid,markerWidth:8,markerHeight:8,refX:7,refY:4,orient:'auto'},defs);svgEl('path',{d:'M0 0 L8 4 L0 8 Z',fill:'#527979'},m);for(const e of g.edges){const a=pos[e.from],b=pos[e.to];if(!a||!b)continue;const forward=b.y>a.y;let x1=a.x+105,y1=a.y+70,x2=b.x+105,y2=b.y;let d=forward?'M'+x1+' '+y1+' C'+x1+' '+(y1+25)+' '+x2+' '+(y2-25)+' '+x2+' '+y2:'M'+(a.x+210)+' '+(a.y+35)+' C'+(a.x+236)+' '+(a.y+85)+' '+(b.x+236)+' '+(b.y+85)+' '+(b.x+210)+' '+(b.y+35);svgEl('path',{d,fill:'none',stroke:'#527979','stroke-width':1.7,'stroke-dasharray':e.dotted?'5 4':'none','marker-end':'url(#'+mid+')'},s);if(e.label){let t=svgEl('text',{x:(x1+x2)/2+4,y:(y1+y2)/2-3,'font-size':11,fill:'#32585a','paint-order':'stroke',stroke:'white','stroke-width':3},s);t.textContent=e.label}}for(const {x,y,n} of Object.values(pos)){svgEl('rect',{x,y,width:210,height:70,rx:7,fill:'#e8f3f0',stroke:'#5c8c81'},s);const fo=svgEl('foreignObject',{x:x+7,y:y+5,width:196,height:60},s);const t=node('div',n.label,fo);t.style.cssText='font:13px system-ui;display:flex;height:100%;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;overflow:auto;color:#19383e'}if(g.unparsed.length)note(p,'有 '+g.unparsed.length+' 行未转换，请查看原图文本。')}
async function diagramView(p,id){const box=node('div',null,p,'panel');node('h3','原始证据工艺图',box);try{const a=await get('/work/diagrams',{id});if(!a.length)return note(box,'暂无证据图；下方仍可查看原始废水。');const sel=select(box,'时期/范围',a.map((r,i)=>[String(i),r.stage+' · '+r.period+' · '+r.scope_key]));const body=node('div',null,box);function render(){body.replaceChildren();const r=a[Number(sel.value)];note(body,r.coverage+' · '+r.source_id+' · '+r.boundaries);drawGraph(body,r.graph);for(const l of r.stream_links||[]){note(body,'关联流股 '+l.water_id+' · 节点 '+l.element_ids+' · '+l.locator);button(body,'查看 '+l.water_id+' 水质及费用',async()=>{const a=await get('/work/stream',{site_id:id,water_id:l.water_id});const d=node('div',null,body,'panel');if(a){record(d,a.water);showRows(d,a.metrics);showRows(d,a.costs)}})}note(body,'缺口：'+r.gaps);const d=node('details',null,body);node('summary','原始图文本',d);node('pre',r.mermaid,d)}sel.onchange=render;render()}catch(e){note(box,e.message)}}
async function casePage(){button(main,'返回技术中心',()=>open('capability'));if(!stats.workspace)return note(main,'启用本地工作区后录入内部案例。');node('h2','公司工程案例库',main);note(main,'真实工程案例仅本地保存；不把案例参数直接当成技术极限。类似客户按案例方向及关联技术版本筛查。');const vs=await get('/work/capabilities');if(!vs.length)return note(main,'先建立公司技术版本，再关联工程案例。');const f=node('div',null,main,'panel'),title=field(f,'案例名称','可用内部匿名编号'),cap=select(f,'技术版本',vs.map(v=>[String(v.id),v.module+' V'+v.version])),dir=select(f,'案例方向（多选）',[]);dir.multiple=true;dir.size=4;function options(){dir.replaceChildren();for(const x of vs.find(v=>String(v.id)===cap.value).directions){const o=node('option',dirs[x]||x,dir);o.value=x;o.selected=true}}cap.onchange=options;options();const site=field(f,'客户编号（可空）','CNxxxx'),water=field(f,'废水记录编号（可空）','Wxxxx'),feed=textArea(f,'实际进水和处理规模','单位、期间、盐种及主要指标'),process=textArea(f,'实际工艺和设备','预处理、膜、后处理、浓水出口'),performance=textArea(f,'实际工程表现','产水、回收率、能耗、稳定性等'),limits=textArea(f,'适用限制','前提条件、问题及不可外推范围');const params=textArea(f,'可比较的实际进水参数（每行：参数,数值,单位）','TDS,20,g/L');const cost=field(f,'完整处理方案吨水成本（元/单位，可空）','','','number'),costUnit=select(f,'成本及年量单位',[['m3/a','m³/年'],['t/a','吨/年']]),boundary=field(f,'成本边界','例如：从进水至达标/浓水处置，含能源药剂耗材'),period=field(f,'成本期间','例如：2026');button(f,'保存工程案例',async()=>{try{await post('/work/cases',{title:title.value,site_id:site.value,water_id:water.value,capability_id:Number(cap.value),directions:Array.from(dir.selectedOptions).map(x=>x.value),feed:feed.value,process:process.value,performance:performance.value,limits_note:limits.value,profile:{parameters:params.value.split('\n').filter(x=>x.trim()).map(x=>{const a=x.split(',');if(a.length!==3||!a[1].trim()||!Number.isFinite(Number(a[1])))throw Error('参数格式：名称,数值,单位');return {parameter:a[0].trim(),value:Number(a[1]),unit:a[2].trim()}}),cost:{unit_cost:cost.value===''?null:Number(cost.value),unit:costUnit.value,boundary:boundary.value,period:period.value}}});open('cases')}catch(e){note(f,e.message)}},'primary');for(const r of await get('/work/cases')){const b=node('div',null,main,'panel');node('h3',r.title,b);showRows(b,[r],['feed','process','performance','limits_note']);for(const q of r.profile?.parameters||[])note(b,q.parameter+' '+q.value+' '+q.unit);if(r.profile?.cost?.unit_cost!=null)note(b,'内部完整方案成本：'+r.profile.cost.unit_cost+' · '+r.profile.cost.boundary+' · '+r.profile.cost.period);button(b,'完整方案成本比较',()=>caseCostForm(b,r));button(b,'查找类似客户',async()=>{const a=await get('/work/similar',{id:r.id}),out=node('div',null,b);note(out,'方向相同候选 '+a.length+' 条；条件初筛并非工程适配。');for(const x of a){const z=node('div',null,out,'panel');node('strong',x.name+' · '+(x.water_id||'待核'),z);note(z,(dirs[x.direction]||x.direction)+' · '+x.fit+' · 公开参考 '+(x.reference_fit||'未知')+' · '+(x.needed||[]).join('、'));const m=x.case_similarity;if(m&&m.similarity!=null){note(z,'案例参数相似 '+Math.round(m.similarity*100)+'%（'+m.coverage+'/'+m.target_count+'项） · '+m.point+' · '+m.period+' · '+m.source_id);for(const q of m.comparisons)note(z,q.parameter+'：案例 '+q.case_value+' / 公开 '+q.reference_value+' '+q.unit)}else note(z,'没有可比较的案例进水参数；仅方向相似');button(z,'查看客户',()=>{const d=node('div',null,out,'panel');show(x.site_id,d);d.scrollIntoView()})}})}}


async function cardsPage(){node('h2','客户开发行动卡片',main);note(main,'优先显示历史重点名单；时机、渠道、技术条件均需确认。');const a=await get('/work/cards');const f=node('div',null,main,'row'),filter=select(f,'范围',[['seed','重点待开发客户'],['all','全部待开发线索'],['served','已服务客户（售后/扩容）']]),q=field(f,'搜索','客户名称'),p=node('div',null,main),detail=node('div',null,main);function render(){p.replaceChildren();for(const r of a.filter(x=>(filter.value==='served'?x.relationship==='已服务客户':x.relationship!=='已服务客户'&&(filter.value==='all'||x.priority))&&x.name.includes(q.value))){const b=node('div',null,p,'panel');node('h3',r.name+' · '+(r.priority||'方向候选'),b);if(r.relationship==='已服务客户')note(b,'已服务客户：以下公开线索仅作售后、扩容及案例复制参考，不作为陌生开发。');note(b,[r.province,r.city,r.subject_scope,r.ownership||r.group_ownership||'所有制待核'].filter(Boolean).join(' · '));node('strong','为什么找：',b);note(b,r.why+' · '+(r.source_id||''));node('strong','怎么切入：',b);note(b,r.entry);note(b,'下一步：'+r.next_action);note(b,'需确认：'+r.gap);note(b,r.department_hint);for(const x of r.events)note(b,'历史项目 '+x.date+' · '+x.project+' · '+x.status+' · '+x.source_id);for(const x of r.channels)linkValue(b,x.department||'公开入口',x.public_work_channel);if(!r.channels.length)note(b,'尚无符合用途的公开工作渠道');button(b,'查看客户',()=>{detail.replaceChildren();show(r.site_id,detail);detail.scrollIntoView()});const l=node('a','下载公开技术商务简报',b);l.href='/work/report?id='+encodeURIComponent(r.site_id);l.download=r.site_id+'-brief.md'}}filter.onchange=render;q.oninput=render;render()}
function caseCostForm(p,r){const b=node('div',null,p,'panel'),old=field(b,'客户同边界现状成本（元/单位）','','','number'),volume=field(b,'可比年处理量','','','number'),unit=select(b,'年量单位',[['m3/a','m³/年'],['t/a','吨/年']]),boundary=field(b,'处理边界','',r.profile?.cost?.boundary),period=field(b,'期间','',r.profile?.cost?.period);button(b,'计算可比成本差',async()=>{const x=await post('/work/case-cost',{id:r.id,old:old.value===''?null:Number(old.value),volume:volume.value===''?null:Number(volume.value),unit:unit.value,boundary:boundary.value,period:period.value});note(b,x.state==='scenario'?'年节约情景 '+x.annual_saving+' 元；单位节约 '+x.unit_saving+' 元':x.reason)})}
