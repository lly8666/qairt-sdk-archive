<header><h1>工业废水 · 技术商务工作台</h1><small id="mode">公开市场事实 + 本地工作区</small></header><nav id="nav"></nav><main id="main"></main>
<script>
const $=id=>document.getElementById(id),main=$('main');
const dirs={high_salt:'高盐浓缩',ammonia:'氨氮处理',metal_recovery:'金属回收',organic:'高有机废水',evaporation:'减蒸发负荷',reuse:'废水回用',external_disposal:'废液减量',membrane_optimization:'膜系统优化',resource_recovery:'资源回收',capacity_retrofit:'扩容改造',new_build_retrofit:'新建技改',procurement_followup:'采购跟进'};
const owners={private_controlled:'民营控制',central_state_controlled:'央企控制',local_state_controlled:'地方国资',foreign_controlled:'外资控制',mixed_control_unclear:'混合待核',other:'其他',unknown:'待核'};
const queues={seed_review:'历史重点线索',signal_and_channel:'有线索及公开渠道',signal_review:'线索待核',scope_review:'主体范围待核',water_evidence_gap:'水需求待核'};
const stages=['未联系','待确认','技术初筛','取样/小试','方案报价','项目推进','已成交','暂缓','关闭'];
let stats=null,role='business',selected=null,serial=0;
function node(tag,text,parent,cls){const x=document.createElement(tag);if(text!==undefined&&text!==null)x.textContent=text;if(cls)x.className=cls;if(parent)parent.append(x);return x}
function button(parent,text,fn,cls){const b=node('button',text,parent,cls);b.onclick=fn;return b}
function field(parent,title,placeholder,value,type){const l=node('label',title,parent);const i=node('input',null,l);i.placeholder=placeholder||'';i.value=value||'';i.type=type||'text';return i}
function select(parent,title,options){const l=node('label',title,parent),s=node('select',null,l);for(const x of options){const o=node('option',x[1],s);o.value=x[0]}return s}
function textArea(parent,title,placeholder){const l=node('label',title,parent),t=node('textarea',null,l);t.placeholder=placeholder||'';return t}
function note(parent,text){return node('p',text,parent,'muted')}
function tag(parent,text){return node('span',text,parent,'tag')}
function linkValue(parent,key,value){const l=node('div',null,parent);node('strong',key+'：',l);if(/^https?:\/\//i.test(value)){const a=node('a',value,l);a.href=value;a.target='_blank';a.rel='noopener'}else if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)){const a=node('a',value,l);a.href='mailto:'+value}else if(/^\+?[0-9() -]{7,}$/.test(value)){const a=node('a',value,l);a.href='tel:'+value}else node('span',value,l)}
function record(parent,r,keys){const box=node('div',null,parent,'panel');for(const k of (keys||Object.keys(r))){const v=r[k];if(v===null||v===undefined||v==='')continue;if(k==='public_work_channel'||k==='source_url'||k==='url'){linkValue(box,k,v)}else{const l=node('div',null,box);node('strong',k+'：',l);node('span',String(v),l)}}return box}
async function get(path,params){const r=await fetch(path+'?'+new URLSearchParams(params||{}));const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function nav(){const n=$('nav');n.replaceChildren();for(const [k,t] of [['business','业务工作台'],['tech','技术工作台'],['capability','技术能力'],['tasks','待办任务'],['economics','经济测算'],['market','市场概览']])button(n,t,()=>open(k),role===k?'active':'')}
function dashboard(parent){const g=node('div',null,parent,'grid');for(const [name,val] of [['研究主体',stats.subjects],['废水原始记录',stats.water_records],['命中独立流股',stats.signal_streams],['主体×方向候选',stats.signals],['有线索主体',stats.signal_sites],['有控制权证据主体',stats.ownership_sites]]){const x=node('div',null,g,'tile');node('small',name,x);node('strong',Number(val||0).toLocaleString(),x)}note(parent,'独立流股数、方向命中数、主体×方向数分别统计；关键词线索不是已确认需求。')}
async function open(page){role=page;serial++;nav();main.replaceChildren();try{if(page==='business'||page==='tech')return browsePage();if(page==='market')return marketPage();if(page==='capability')return capabilityPage();if(page==='tasks')return tasksPage();if(page==='economics')return economicsPage()}catch(e){note(main,e.message)}}
function browsePage(){dashboard(main);const f=node('div',null,main,'row filters'),q=field(f,'搜索企业/产品/城市','输入关键词'),p=select(f,'地区',[['','全部'],...stats.provinces.map(x=>[x.province,x.province])]),d=select(f,'废水/技术方向',[['','全部'],...Object.entries(dirs)]),o=select(f,'所有制',[['','全部'],...Object.entries(owners)]),qu=select(f,'开发队列',[['','全部'],...Object.entries(queues)]),pr=select(f,'排序',[['1','民企证据优先'],['0','不区分所有制']]),ch=select(f,'公开渠道',[['1','有渠道优先'],['0','不区分']]);const split=node('div',null,main,'split'),left=node('section',null,split,'panel'),right=node('section','选择一家企业查看档案。',split,'panel'),count=node('p','',left),items=node('div',null,left),pages=node('div',null,left,'row');let page=0,total=0;
async function search(){const z=await get('/work/sites',{q:q.value,province:p.value,direction:d.value,owner:o.value,queue:qu.value,private:pr.value,channels:ch.value,limit:25,offset:page*25});total=z.total;count.textContent='共 '+total+' 条主体记录';items.replaceChildren();for(const r of z.items){const b=button(items,r.name,()=>show(r.site_id,right),'item');node('div',[r.province,r.city,r.record_type].filter(Boolean).join(' · '),b,'muted');for(const x of r.directions)tag(b,(dirs[x.direction]||x.direction)+' '+x.water_records);node('small',(queues[r.research_queue]||r.research_queue)+' · 废水 '+r.water_count+' · 公开渠道 '+r.contact_count,b);for(const x of r.ownership)node('div',(owners[x.ownership_class]||x.ownership_class)+' · '+x.effective_period+(x.link_role==='group_scope'?'（集团）':''),b,'subtle')}prev.disabled=page===0;next.disabled=(page+1)*25>=total}
const prev=button(pages,'上一页',()=>{page--;search()}),next=button(pages,'下一页',()=>{page++;search()});button(f,'筛选',()=>{page=0;search()},'primary');q.onkeydown=e=>{if(e.key==='Enter'){page=0;search()}};for(const x of [p,d,o,qu,pr,ch])x.onchange=()=>{page=0;search()};search()}
function showRows(parent,arr,keys){if(!arr||!arr.length){note(parent,'暂无公开记录或尚未映射。');return}for(const r of arr)record(parent,r,keys)}
async function show(siteId,right){const n=++serial;right.textContent='读取客户资料…';try{const x=await get('/work/detail',{id:siteId});if(n!==serial)return;selected=x;right.replaceChildren();node('h2',x.site.name,right);note(right,[x.site.province,x.site.city,x.site.record_type,x.site.status].filter(Boolean).join(' · '));for(const a of x.directions)tag(right,(dirs[a.direction]||a.direction)+' · '+a.water_records+'流股');const tabs=node('div',null,right,'row'),panel=node('div',null,right);function tab(name,fn){button(tabs,name,()=>{panel.replaceChildren();fn()})}
function overview(){record(panel,x.site,['province','city','address','category','capacity_summary','water_summary']);node('h3','可调查方向',panel);for(const a of x.directions){const c=node('div',null,panel,'panel');node('strong',dirs[a.direction]||a.direction,c);note(c,'直接命中流股 '+a.direct_water_records+'；上下文命中 '+a.contextual_water_records);note(c,a.evidence_signal||'关键词筛查，需查看原始流股与来源');note(c,a.qualification_gap||'核实实际流量、水质、现有设施和采购计划');if(stats.workspace)button(c,'记录下一步',()=>{panel.replaceChildren();followupForm(panel,x,a.candidate_id)})}node('h3','所有制及采购',panel);showRows(panel,x.ownership,['ownership_class','listed_status','effective_period','link_role','boundary','source_id']);showRows(panel,x.procurement,['buyer_label','package_scope','procurement_stage','evidence_period','boundary','outreach_hypothesis','source_url']);node('h3','公开工作渠道',panel);showRows(panel,x.channels,['organization','contact_scope','department','channel_type','public_work_channel','use_boundary','source_id'])}
function water(){node('h3','废水原始流股',panel);note(panel,'同一流股可能在多个方向出现；设计量、实际量和全厂量分开查看。');for(const w of x.water){const c=node('div',null,panel,'stream');node('strong',w.stream||w.water_id,c);tag(c,w.water_id);node('div',[w.stage,w.flow!==null?w.flow+' '+(w.flow_unit||''):null,w.flow_basis].filter(Boolean).join(' · '),c,'subtle');note(c,'水质：'+(w.pollutants||'未披露'));note(c,'工艺：'+(w.process||'未披露'));note(c,'去向：'+(w.destination||'未披露'));note(c,'残余物：'+(w.residuals||'未披露'));if(stats.workspace){button(c,'录入该流股参数',()=>observationForm(c,x.site.site_id,w));button(c,'查看已录参数',async()=>{const a=await get('/work/observations',{site_id:x.site.site_id,water_id:w.water_id});for(const r of a)record(c,r,['parameter','value','unit','scope','basis','observed_on','notes'])})}}node('h3','现有工艺设备',panel);showRows(panel,x.systems);showRows(panel,x.connections)}
function membranes(){node('h3','膜设备及适用边界',panel);showRows(panel,x.equipment,['unit_label','technology','technology_family','role','feed','permeate_destination','concentrate_destination','stage','period','application_boundary','specification','source_id']);node('h3','膜技术审查',panel);showRows(panel,x.membrane_reviews,['scope_key','stage','period','presence','evidence_basis','gaps','source_id']);showRows(panel,x.retrofits)}
tab('客户概况',overview);tab('废水与流股',water);tab('膜与设备',membranes);tab('水质测点',async()=>{const m=await get('/api/metrics',{id:siteId,limit:100,offset:0});if(n!==serial)return;note(panel,'水质指标 '+m.total+' 条，最多显示100条。');showRows(panel,m.items,['point','metric','value_num','value_text','unit','result_kind','period','source_id'])});tab('采购与联系',()=>{showRows(panel,x.procurement);showRows(panel,x.channels,['organization','contact_scope','department','channel_type','public_work_channel','use_boundary','source_id'])});tab('生产与集团',()=>{showRows(panel,x.production);showRows(panel,x.projects);showRows(panel,x.entities);showRows(panel,x.legacy_relations);showRows(panel,x.relations)});tab('证据',()=>showRows(panel,x.sources,['source_id','title','url','document_date','scope']));tab('跟进',()=>{if(stats.workspace)followupForm(panel,x);showRows(panel,x.followups||[])});
if(role==='tech')water();else overview()}catch(e){right.textContent=e.message}}
function followupForm(parent,x,candidate){if(!stats.workspace){note(parent,'启动时添加 --workspace 路径启用本地跟进。');return}node('h3','新增下一步行动',parent);const f=node('div',null,parent,'panel'),stage=select(f,'阶段',stages.map(x=>[x,x]));const owner=field(f,'负责人','姓名'),action=field(f,'下一步行动','例如：联系环保负责人确认水量'),date=field(f,'计划日期','','','date'),notes=textArea(f,'备注','');const msg=node('p','',f);button(f,'保存',async()=>{try{await post('/work/followups',{site_id:x.site.site_id,candidate_id:candidate||null,stage:stage.value,owner:owner.value,next_action:action.value,next_date:date.value,notes:notes.value});msg.textContent='已保存到本地工作区。'}catch(e){msg.textContent=e.message}},'primary')}
function observationForm(parent,siteId,w){const f=node('div',null,parent,'panel');node('strong','录入 '+w.water_id+' 参数',f);const grid=node('div',null,f,'formgrid'),parameter=field(grid,'指标','TDS / COD / 氨氮 / pH'),value=field(grid,'数值','数值','','number'),unit=field(grid,'单位','mg/L / g/L'),scope=select(grid,'采样位置',[['feed','进水'],['permeate','产水'],['concentrate','浓水'],['process','工艺段'],['other','其他']]),basis=select(grid,'数据依据',[['actual_verified','实际实测'],['customer_disclosed','客户提供'],['synthetic','合成测试']]),date=field(grid,'日期','','','date'),notes=textArea(f,'说明','采样点、检测方法或备注');button(f,'保存参数',async()=>{try{const r=await post('/work/observations',{site_id:siteId,water_id:w.water_id,parameter:parameter.value,value:Number(value.value),unit:unit.value,scope:scope.value,basis:basis.value,observed_on:date.value,notes:notes.value});note(f,'已保存，记录编号 '+r.id)}catch(e){note(f,e.message)}},'primary')}
function addConstraint(parent){const row=node('div',null,parent,'row panel');const p=field(row,'参数','TDS / COD / pH'),u=field(row,'单位','mg/L'),s=select(row,'范围',[['feed','进水'],['permeate','产水'],['concentrate','浓水'],['process','工艺段']]),lo=field(row,'最小值（可空）','', '', 'number'),hi=field(row,'最大值（可空）','', '', 'number');button(row,'删除',()=>row.remove());return ()=>({parameter:p.value,unit:u.value,scope:s.value,min:lo.value===''?null:Number(lo.value),max:hi.value===''?null:Number(hi.value),hard:true})}
async function capabilityPage(){if(!stats.workspace)return note(main,'启动时添加 --workspace 路径启用技术能力版本保存。');node('h2','公司技术能力库',main);note(main,'每次保存形成新版本。只有录入实际流股参数后才做数值筛查；未知不算通过。');const f=node('div',null,main,'panel'),name=field(f,'技术模块名称','例如：高盐膜浓缩'),direction=select(f,'适用方向',Object.entries(dirs)),notes=textArea(f,'适用边界、前处理、产水及浓水去向','说明适用水质、规模、限制和成熟度'),constraints=node('div',null,f),collect=[];addConstraint(constraints);button(f,'添加参数边界',()=>collect.push(addConstraint(constraints)));const msg=node('p','',f);button(f,'保存技术新版本',async()=>{try{const rules=Array.from(constraints.children).map(x=>{const a=x.querySelectorAll('input,select');return {parameter:a[0].value,unit:a[1].value,scope:a[2].value,min:a[3].value===''?null:Number(a[3].value),max:a[4].value===''?null:Number(a[4].value),hard:true}}).filter(x=>x.parameter&&x.unit&&(x.min!==null||x.max!==null));await post('/work/capabilities',{module:name.value,directions:[direction.value],constraints:rules,notes:notes.value});capabilityPage()}catch(e){msg.textContent=e.message}},'primary');const versions=await get('/work/capabilities');node('h3','已保存版本',main);for(const v of versions){const c=node('div',null,main,'panel');node('strong',v.module+' · V'+v.version,c);note(c,v.directions.map(x=>dirs[x]||x).join('、')+' · '+v.notes);button(c,'扫描市场流股',async()=>{const m=await get('/work/matches',{version:v.id});const box=node('div',null,c,'panel');const count={};for(const r of m)count[r.fit]=(count[r.fit]||0)+1;note(box,'流股候选 '+m.length+' 条；'+Object.entries(count).map(x=>x[0]+': '+x[1]).join(' · '));for(const r of m.slice(0,40)){const z=node('div',null,box);node('strong',r.name+' · '+r.water_id,z);node('span',' '+(dirs[r.direction]||r.direction)+' · ',z);node('span',r.fit,z,'status '+r.fit);if(r.needed.length)note(z,'缺少参数：'+r.needed.join('、'))}});const old=versions.find(x=>x.module===v.module&&x.version===v.version-1);if(old)button(c,'对比上一版',async()=>{const r=await get('/work/compare',{old:old.id,new:v.id});note(c,'流股 '+r.before+' → '+r.after+'；新增 '+r.added.length+'；移除 '+r.removed.length+'；适配状态变化 '+r.changed.length)})}}
async function tasksPage(){if(!stats.workspace)return note(main,'启动时添加 --workspace 路径启用本地任务。');node('h2','客户待办与下一步行动',main);const a=await get('/work/tasks');for(const [key,title] of [['overdue','已逾期'],['today','今天到期'],['upcoming','未来7天'],['undated','未设日期']]){node('h3',title+'（'+a[key].length+'）',main);for(const t of a[key]){const c=node('div',null,main,'panel');node('strong',t.next_action,c);note(c,t.site_id+' · '+t.owner+' · '+t.stage+' · '+(t.next_date||'未设日期'));button(c,'标记完成',async()=>{await post('/work/followup-complete',{id:t.id});tasksPage()})}}note(main,'已完成 '+a.completed_count+' 项。')}
async function economicsPage(){node('h2','技术经济性情景测算',main);note(main,'填写同一流股、同一期间、同一单位口径下的客户现状与改造后数据；结果是情景估算，不是报价。');const f=node('div',null,main,'panel'),grid=node('div',null,f,'formgrid');const volume=field(grid,'年处理量','例如 30000','','number'),unit=select(grid,'流量单位',[['m3/a','m³/年'],['t/a','吨/年']]),scope=field(grid,'流股/处理边界','例如：高盐浓水'),period=field(grid,'数据期间','例如：2026年'),basis=select(grid,'处理量依据',[['actual_verified','实际核实'],['customer_disclosed','客户提供'],['explicit_assumption','明确假设'],['synthetic','合成测试']]),old=field(grid,'现状单位成本（元/单位）','', '', 'number'),now=field(grid,'改造后单位成本（元/单位）','', '', 'number'),recovery=field(grid,'年净回收收益（元）','', '0','number'),capex=field(grid,'新增投资（元）','', '', 'number');const msg=node('div',null,f);button(f,'计算',async()=>{try{const r=await post('/work/economics',{annual_volume:Number(volume.value),volume_unit:unit.value,scope:scope.value,period:period.value,volume_basis:basis.value,cost_boundary:scope.value,old_cost:Number(old.value),new_cost:Number(now.value),incremental_recovery:Number(recovery.value||0),capex:Number(capex.value)});msg.replaceChildren();node('h3','测算结果',msg);if(r.state==='unknown')note(msg,'缺少可比数据，暂不能计算。');else{node('strong','年净节约：'+r.annual_saving.toLocaleString()+' 元',msg);node('p',r.payback_years===null?'节约非正或无回收期':'静态回收期：'+r.payback_years.toFixed(2)+' 年',msg);note(msg,'输入依据：'+r.volume_basis+'；边界：'+r.boundary)}}catch(e){note(msg,e.message)}},'primary');note(main,'注意：吨与立方米不自动换算；没有处理量、期间、成本边界或投资数据时不生成回收期。')}
function marketPage(){dashboard(main);node('h2','筛查方向分布',main);for(const x of stats.directions){const c=node('div',null,main,'panel');node('strong',dirs[x.direction]||x.direction,c);note(c,'主体×方向 '+x.n+' · 命中流股 '+x.streams+' · 直接词 '+x.direct_streams)}node('h3','开发研究队列',main);for(const x of stats.queues)note(main,(queues[x.research_queue]||x.research_queue)+' · '+x.n+' 个主体')}
