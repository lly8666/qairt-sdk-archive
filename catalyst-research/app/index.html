<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工业废水市场情报 · 本地预览</title>
<style>body{margin:0;font:15px system-ui,sans-serif;background:#f3f6f7;color:#17333c}header{padding:20px;background:#173d46;color:white}h1{font-size:22px;margin:0 0 6px}main{max-width:1150px;margin:auto;padding:16px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}input,select,button{font:inherit;padding:10px;border:1px solid #c3cdd0;border-radius:7px;background:white}button{cursor:pointer;color:#173d46}button:hover{background:#e1efeb}.layout{display:grid;grid-template-columns: minmax(240px,1fr) minmax(0,2fr);gap:16px}.card,section{background:white;border:1px solid #d9e2e5;border-radius:10px;padding:14px;margin:8px 0}.item{width:100%;text-align:left;margin:3px 0;display:block}.muted,small{color:#546c73}.tabs{display:flex;flex-wrap:wrap;gap:6px}.data{white-space:pre-wrap;overflow-wrap:anywhere;font:13px system-ui}h2{font-size:19px}h3{font-size:16px;margin:10px 0}a{color:#165a72}.tag{color:#435d65;font-size:13px} @media(max-width:700px){.layout{display:block}main{padding:10px}.filters>*{max-width:100%}}</style>
<header><h1>工业废水市场情报</h1><div>公开事实 · 本地只读预览 | 尚无真实技术匹配或内部CRM</div></header><main><div class="filters"><input id="q" placeholder="企业、产品、城市" aria-label="搜索"><input id="province" placeholder="省份（准确名称）" aria-label="省份"><select id="ownership" aria-label="所有制"><option value="">全部所有制</option><option value="private_controlled">民营控制证据</option><option value="central_state_controlled">央企控制证据</option><option value="local_state_controlled">地方国资控制证据</option><option value="foreign_controlled">外资控制证据</option><option value="unknown">法人控制证据待核</option></select><label><input type="checkbox" id="seed">旧重点商机</label><button id="search">查询</button></div><small>所有制按已记录法人证据时期筛选，非当前控制权确认。集团证据另列。</small><div class="layout"><section><div id="count"></div><div id="results"></div><div class="filters"><button id="prev">上一页</button><button id="next">下一页</button></div></section><section id="detail"><h2>客户详情</h2><p>请选择一条主体记录。</p></section></div></main>
<script>
const $=id=>document.getElementById(id);let page=0,total=0,current=null,token=0,searchToken=0;
const fields={entities:'主体映射',ownership:'所有制证据',relations:'组织关系',procurement:'采购证据',production:'生产规模',projects:'工程项目',water:'废水量',streams:'独立流股',systems:'污水站',connections:'流向关系',measurement_groups:'测点分组',diagrams:'证据流程图',membrane_reviews:'膜核查',retrofits:'改造假设',seeds:'旧商机初筛',contact_routes:'公开工作渠道用途',sources:'来源'};
const cn={site_id:'原始主体编号',name:'名称',address:'地址',stage:'阶段',period:'时期',flow:'水量/能力数值',flow_unit:'单位',flow_basis:'口径',stream:'废水流股',scope_class:'口径分类',quantity_status:'可比水量状态',source_id:'来源编号',boundary:'边界',process:'处理工艺',destination:'去向',result_kind:'结果类型',metric:'指标',value_num:'数值',unit:'单位',evidence_period:'证据时期',ownership_class:'控制类别',listed_status:'上市状态',procurement_stage:'采购阶段',package_scope:'采购包',buyer_label:'采购方/关联方',opening_status:'开放状态',outreach_hypothesis:'开发假设',qualification_gap:'待确认',title:'来源标题',url:'来源链接'};
function el(tag,text,parent){let e=document.createElement(tag);if(text!=null)e.textContent=text;if(parent)parent.append(e);return e}
async function get(path,params){let r=await fetch(path+'?'+new URLSearchParams(params));if(!r.ok)throw Error('查询失败 '+r.status);return r.json()}
function record(parent,r){const c=el('div',null,parent);c.className='card';for(const [k,v] of Object.entries(r)){if(v==null||v==='')continue;let line=el('div',null,c);line.className='data';el('strong',(cn[k]||k)+'：',line);if(k.endsWith('url')||k==='url'){try{let u=new URL(v);if(['https:','http:'].includes(u.protocol)){let a=el('a',v,line);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';continue}}catch(e){}}el('span',String(v),line)}}
async function search(){let serial=++searchToken;try{let d=await get('/api/sites',{q:$('q').value,province:$('province').value,ownership:$('ownership').value,seed:$('seed').checked?'1':'0',limit:20,offset:page*20});if(serial!==searchToken)return;total=d.total;$('count').textContent='共 '+total+' 个研究主体 · 第 '+(page+1)+' 页';$('results').replaceChildren();for(const x of d.items){let b=el('button',null,$('results'));b.className='item';el('strong',x.name,b);el('div',[x.province,x.city,x.record_type].filter(Boolean).join(' · '),b).className='tag';el('div','废水 '+x.water_count+' | 流股 '+x.stream_count+' | '+(x.legal_ownership_count?'有分期控制证据':'法人控制待核'),b).className='tag';b.onclick=()=>openSite(x.site_id)}$('prev').disabled=page===0;$('next').disabled=(page+1)*20>=total}catch(e){$('count').textContent=e.message}}
async function openSite(id){let n=++token;$('detail').textContent='加载中…';try{let d=await get('/api/site',{id});if(n!==token)return;current=d;let root=$('detail');root.replaceChildren();el('h2',d.site.name,root);el('p',d.site.status+' · '+d.site.mapping_state,root);el('p','以下均为公开资料，历史/设计不等于现行。商机非确认需求。',root).className='muted';let tabs=el('div',null,root);tabs.className='tabs';let panel=el('div',null,root);function show(key){panel.replaceChildren();if(key==='overview'){record(panel,d.site);return}el('h3',fields[key]+'（'+d[key].length+'）',panel);for(let r of d[key])record(panel,r);if(!d[key].length)el('p','未取得或尚未映射，不代表不存在。',panel)}function tab(label,fn){let b=el('button',label,tabs);b.onclick=fn}tab('概况',()=>show('overview'));for(let k of Object.keys(fields))tab(fields[k],()=>show(k));tab('水质明细',()=>loadMetrics(0));async function loadMetrics(offset){panel.replaceChildren();try{let m=await get('/api/metrics',{id,limit:50,offset});if(n!==token)return;panel.replaceChildren();el('h3','水质 '+m.total+' 条 · '+(offset+1)+' 起',panel);let controls=el('div',null,panel);if(offset){let b=el('button','上一页',controls);b.onclick=()=>loadMetrics(offset-50)}if(offset+50<m.total){let b=el('button','下一页',controls);b.onclick=()=>loadMetrics(offset+50)}for(let r of m.items)record(panel,r)}catch(e){panel.textContent=e.message}}show('overview')}catch(e){$('detail').textContent=e.message}}
$('search').onclick=()=>{page=0;search()};$('q').onkeydown=e=>{if(e.key==='Enter'){page=0;search()}};$('prev').onclick=()=>{if(page){page--;search()}};$('next').onclick=()=>{if((page+1)*20<total){page++;search()}};search();
</script></html>
